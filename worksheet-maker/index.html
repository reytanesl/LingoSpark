<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* LingoSpark site-design tokens */
      --sd-red: #C8102E;
      --sd-red-hi: #E23A52;
      --sd-red-deep: #8E0B22;
      --sd-burgundy: #6E0F27;
      --sd-navy: #012169;
      --sd-navy-deep: #00133F;
      --sd-cream: #FFF4E8;
      --sd-bg-top: #FFF7F6;
      --sd-bg-bottom: #FBE6E4;
      --sd-blush: #FBE6E4;
      --sd-chip: #FFF0EE;
      --sd-chip-border: #F3CFCB;
      --sd-line: #F0D5D2;
      --sd-muted: #5B5566;
      --sd-card-shadow: 0 0 0 4px rgba(200, 16, 46, 0.06), 0 14px 30px rgba(78, 10, 30, 0.10);
      --sd-radius: 22px;
      --font-primary: 'Poppins', system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, sans-serif;
      --font: var(--font-body);
      --slide-font: 'Barlow', var(--font-primary);
      --royal-blue: var(--sd-navy);
      --pillarbox-red: var(--sd-red);
      --bright-white: #FFFFFF;
      --light-grey: var(--sd-blush);
      --text-dark: #262335;
      --text-muted: var(--sd-muted);
      --success-green: #00823B;
      --border-light: var(--sd-line);
      --surface: #FFFFFF;
      --surface-2: var(--sd-chip);
      --accent: var(--sd-red);
      --radius: var(--sd-radius);
      --radius-sm: 14px;
      --shadow: var(--sd-card-shadow);
      --shadow-soft: 0 8px 18px rgba(78, 10, 30, 0.06);
      --sheet-size: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 90%; }
    body {
      font-family: var(--font-body);
      background: var(--sd-bg-top) linear-gradient(180deg, var(--sd-bg-top) 0%, var(--sd-bg-bottom) 100%) fixed;
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 2.6rem;
    }
    h1, h2, h3, button, .btn, .sheet-kicker, .num, .badge, .toggle button, .lang-tabs button, .step-head h2 {
      font-family: var(--font-primary);
    }

    header.site-header {
      position: relative;
      background: #fff;
      border-bottom: 4px solid var(--sd-red);
      box-shadow: 0 4px 0 rgba(200, 16, 46, 0.08), 0 8px 22px rgba(78, 10, 30, 0.06);
      padding: 0.7rem 1.25rem 0.75rem;
    }
    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 1.5rem;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
      text-align: left;
    }
    .brand-logo {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 2px 6px rgba(78, 10, 30, 0.12));
    }
    .brand-text { min-width: 0; }
    header.site-header h1 {
      color: var(--sd-navy);
      font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    header.site-header #tagline {
      color: var(--sd-muted);
      font-family: var(--font-body);
      font-size: 0.92rem;
      margin-top: 0.2rem;
      max-width: 36rem;
    }
    .lang-tabs {
      display: inline-flex;
      padding: 0.22rem;
      border: 1.6px solid var(--sd-chip-border);
      border-radius: 999px;
      background: var(--sd-chip);
      gap: 0.15rem;
    }
    .lang-tabs button {
      border: none;
      background: transparent;
      padding: 0.45rem 1.05rem;
      font: inherit;
      font-weight: 700;
      color: var(--sd-navy);
      cursor: pointer;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .lang-tabs button:hover { color: var(--sd-red); }
    .lang-tabs button.active {
      background: var(--sd-red);
      color: white;
      box-shadow: 0 3px 0 var(--sd-red-deep);
    }

    .composer-panel.is-hidden { display: none !important; }

    .pl-class-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0.35rem 0 0.85rem;
    }
    .pl-class-row label {
      margin: 0;
      font-weight: 700;
      font-family: var(--font-primary);
      color: var(--sd-navy);
      border: 1.6px solid var(--sd-chip-border);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      cursor: pointer;
      background: #fff;
    }
    .pl-class-row input { position: absolute; opacity: 0; pointer-events: none; }
    .pl-class-row label.is-selected {
      background: var(--sd-red);
      color: #fff;
      border-color: var(--sd-red);
      box-shadow: 0 3px 0 var(--sd-red-deep);
    }

    .pl-subject-groups {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0.5rem 0 1rem;
    }
    .pl-subject-group {
      border: 1.6px solid var(--sd-chip-border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.85rem 0.9rem;
      background: var(--sd-chip);
    }
    .pl-subject-group h3 {
      margin: 0 0 0.55rem;
      font-size: 0.95rem;
      color: var(--sd-navy);
      font-weight: 800;
    }
    .pl-subject-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .pl-subject-options label {
      margin: 0;
      font-weight: 600;
      font-family: var(--font-body);
      font-size: 0.88rem;
      color: var(--text-dark);
      border: 1.6px solid var(--sd-chip-border);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      background: #fff;
    }
    .pl-subject-options input { position: absolute; opacity: 0; pointer-events: none; }
    .pl-subject-options label.is-selected {
      border-color: var(--sd-red);
      box-shadow: inset 0 0 0 1.5px var(--sd-red);
      color: var(--sd-navy);
      font-weight: 700;
    }

    /* Polish SP worksheets — white print-friendly sheet, pale doodles, rounded frames */
    .sheet.pl-sp .sheet-body {
      position: relative;
      overflow: hidden;
      font-family: var(--pl-font-body, 'Nunito', sans-serif);
      background-color: #fff;
      background-image: var(--pl-pattern-image, none);
      background-size: 180px 180px;
      background-repeat: repeat;
      color: #243047;
      border-radius: var(--pl-radius, 18px);
      border: 2px solid color-mix(in srgb, var(--pl-accent, #012169) 22%, white);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      padding: 1.45rem var(--pl-margin-pad, 3rem) 1.8rem;
    }
    .sheet.pl-sp .sheet-body,
    .sheet.pl-sp .sheet-body .task-head,
    .sheet.pl-sp .sheet-body p,
    .sheet.pl-sp .sheet-body li,
    .sheet.pl-sp .sheet-body td {
      font-family: var(--pl-font-body, 'Nunito', sans-serif);
    }
    .sheet.pl-sp .sheet-header {
      border-bottom: 4px solid var(--pl-accent, var(--royal-blue));
      box-shadow:
        0 3px 0 var(--pl-accent-2, var(--success-green)),
        0 6px 0 color-mix(in srgb, var(--pl-accent, #012169) 45%, white);
      background: linear-gradient(180deg, color-mix(in srgb, var(--pl-band, #E2E8F0) 55%, white), #fff);
      border-radius: calc(var(--pl-radius, 18px) - 2px) calc(var(--pl-radius, 18px) - 2px) 14px 14px;
      margin: -0.35rem calc(0px - var(--pl-margin-pad, 3rem) + 0.85rem) 0.9rem;
      padding: 0.65rem 0.55rem 0.7rem;
    }
    .sheet.pl-sp .sheet-kicker {
      font-family: var(--pl-font, 'Nunito', sans-serif);
      color: var(--pl-accent, var(--royal-blue));
      letter-spacing: 0.04em;
    }
    .sheet.pl-sp .sheet-header h2 {
      font-family: var(--pl-font, 'Nunito', sans-serif);
      color: var(--pl-accent, var(--royal-blue));
      font-weight: 700;
    }
    .sheet.pl-sp .sheet-logo {
      opacity: 0.72;
      filter: saturate(0.85);
    }
    .sheet.pl-sp[data-pl-vibe="playful"] .sheet-header h2 {
      font-size: 1.48em;
      letter-spacing: 0.01em;
    }
    .sheet.pl-sp[data-pl-vibe="focused"] .sheet-body {
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }
    .pl-doodle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      color: var(--pl-accent, #012169);
      overflow: hidden;
    }
    .pl-doodle {
      position: absolute;
      color: var(--pl-accent, #012169);
      opacity: var(--pl-doodle-opacity, 0.2);
    }
    .pl-doodle.pl-d-right { color: var(--pl-accent-2, var(--pl-accent, #012169)); }
    .pl-doodle.pl-d-float {
      color: var(--pl-accent-2, var(--pl-accent, #012169));
      opacity: calc(var(--pl-doodle-opacity, 0.2) * 0.55);
    }
    .sheet.pl-sp .sheet-body > *:not(.pl-doodle-layer) {
      position: relative;
      z-index: 1;
    }
    .sheet.pl-sp .task-head {
      color: var(--pl-accent, var(--royal-blue));
      font-family: var(--pl-font, 'Nunito', sans-serif);
    }
    .sheet.pl-sp .chip,
    .sheet.pl-sp .bank .chip {
      background: color-mix(in srgb, var(--pl-band, #E2E8F0) 55%, white);
      border: 1px solid color-mix(in srgb, var(--pl-accent, #012169) 18%, white);
      border-radius: 999px;
      color: var(--pl-accent, var(--royal-blue));
    }
    .sheet.pl-sp .source-text,
    .sheet.pl-sp .listen-box {
      background: #fff;
      border: 1.5px solid color-mix(in srgb, var(--pl-accent-2, #88c) 35%, #e5e7eb);
      border-left: 4px solid var(--pl-accent-2, var(--success-green));
      border-radius: calc(var(--pl-radius, 18px) * 0.55);
      box-shadow: none;
    }
    .sheet.pl-sp table.vocab {
      border-radius: calc(var(--pl-radius, 18px) * 0.45);
      overflow: hidden;
    }
    .sheet.pl-sp table.vocab th {
      background: var(--pl-accent, var(--royal-blue));
    }
    .sheet.pl-sp .choice-card,
    .sheet.pl-sp .tf-item,
    .sheet.pl-sp .open-item {
      border-radius: calc(var(--pl-radius, 18px) * 0.4);
    }
    .sheet.pl-sp .pl-practice-kind {
      border-radius: 999px;
    }
    .pl-practice-item {
      margin: 0.55rem 0 0.75rem;
    }
    .pl-practice-kind {
      display: inline-block;
      font-size: 0.72em;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--pl-accent, var(--royal-blue));
      background: color-mix(in srgb, var(--pl-band, #E2E8F0) 70%, white);
      border-radius: 999px;
      padding: 0.12em 0.55em;
      margin-bottom: 0.25rem;
    }
    .gw-bullets {
      margin: 0.35rem 0 0.55rem 1.2rem;
      padding: 0;
    }
    .gw-bullets li {
      margin: 0.2rem 0;
    }

    .wrap { max-width: 980px; margin: 0 auto; padding: 1.35rem 1.15rem 3rem; }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.6px solid var(--sd-red);
      padding: 1.25rem 1.3rem 1.4rem;
      margin-bottom: 1.15rem;
    }
    .composer-step {
      padding: 1.05rem 0 1.15rem;
      border-bottom: 1px solid var(--sd-line);
    }
    .composer-step:last-of-type { border-bottom: none; padding-bottom: 0.35rem; }
    .step-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.85rem;
    }
    .step-num {
      flex: 0 0 auto;
      width: 1.85rem;
      height: 1.85rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.88rem;
      color: #fff;
      background: var(--sd-red);
      box-shadow: 0 3px 0 var(--sd-red-deep);
    }
    .step-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--sd-navy);
      letter-spacing: -0.01em;
    }
    .step-head .step-sub {
      margin: 0.15rem 0 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .more-options {
      margin-top: 0.85rem;
      border: 1.6px solid var(--sd-chip-border);
      border-radius: var(--radius-sm);
      background: var(--sd-chip);
      padding: 0.15rem 0.85rem 0.85rem;
    }
    .more-options > summary {
      cursor: pointer;
      list-style: none;
      font-weight: 700;
      color: var(--sd-navy);
      padding: 0.7rem 0 0.35rem;
    }
    .more-options > summary::-webkit-details-marker { display: none; }
    .more-options > summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 0.4rem;
      transition: transform 0.15s ease;
    }
    .more-options[open] > summary::before { transform: rotate(90deg); }
    label { display: block; font-weight: 700; color: var(--sd-navy); margin: 0.85rem 0 0.35rem; font-family: var(--font-primary); }
    input[type="url"], input[type="text"], input[type="file"], textarea, select {
      width: 100%;
      font: inherit;
      font-family: var(--font-body);
      padding: 0.72rem 0.85rem;
      border: 1.6px solid var(--sd-chip-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-dark);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    input[type="url"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--sd-red);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
    }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .checks { display: flex; gap: 1.25rem; align-items: flex-start; margin-top: 1rem; flex-wrap: wrap; }
    .checks label {
      margin: 0;
      font-weight: 600;
      font-family: var(--font-body);
      color: var(--text-dark);
      display: flex;
      gap: 0.45rem;
      align-items: flex-start;
    }
    .checks input { accent-color: var(--sd-red); }
    .adapt-options {
      display: none;
      margin-top: 0.65rem;
      padding: 0.75rem 0.9rem;
      border: 1.6px solid var(--sd-chip-border);
      border-radius: var(--radius-sm);
      background: #fff;
      gap: 0.75rem 1.25rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .adapt-options.is-open { display: flex; }
    .adapt-options .adapt-field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 7rem; }
    .adapt-options .adapt-field label { margin: 0; font-size: 0.88rem; font-weight: 600; }
    .adapt-options .adapt-modes { display: flex; gap: 1rem; flex-wrap: wrap; width: 100%; }
    .adapt-options .adapt-modes label { font-weight: 500; }
    .adapt-options input[type="number"],
    .adapt-options select {
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border, #c9d2e0);
      max-width: 8rem;
    }
    .adapt-word-row { display: flex; gap: 0.5rem; align-items: center; }
    .adapt-word-row span { opacity: 0.7; }
    .task-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 1rem;
      margin-top: 0.45rem;
      padding: 0.65rem 0.75rem;
      border: 1.6px solid var(--sd-chip-border);
      border-radius: var(--radius-sm);
      background: var(--sd-chip);
    }
    .task-picker label {
      margin: 0;
      font-weight: 500;
      font-family: var(--font-body);
      color: var(--text-dark);
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      line-height: 1.35;
      padding: 0.35rem 0.4rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      user-select: none;
    }
    .task-picker label:hover {
      background: color-mix(in srgb, var(--sd-red) 6%, white);
    }
    .task-picker label:has(input:checked) {
      color: var(--sd-navy);
      font-weight: 700;
      background: #fff;
      box-shadow: inset 0 0 0 1.5px var(--sd-red);
    }
    .task-picker input {
      accent-color: var(--sd-red);
      width: 1rem;
      height: 1rem;
      flex: 0 0 auto;
      margin-top: 0.12rem;
    }
    @media (max-width: 700px) {
      .task-picker { grid-template-columns: 1fr; }
    }
    .task-extra { margin-top: 0.75rem; }
    .task-extra label { margin: 0 0 0.35rem; }
    .task-extra .hint { margin-top: 0.3rem; }
    #sourceFields.is-dimmed {
      opacity: 0.45;
      pointer-events: none;
    }
    #sourceFields.is-dimmed input,
    #sourceFields.is-dimmed textarea {
      background: var(--sd-chip);
    }
    #suggestionsPanel textarea {
      width: 100%;
      min-height: 5.5rem;
      resize: vertical;
    }
    .picker-actions { display: flex; gap: 0.75rem; margin: 0.4rem 0 0.15rem; flex-wrap: wrap; }
    .picker-actions button {
      background: #fff;
      border: 1.6px solid var(--sd-chip-border);
      color: var(--sd-navy);
      cursor: pointer;
      font: inherit;
      font-family: var(--font-primary);
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }
    .picker-actions button:hover {
      color: var(--sd-red);
      border-color: var(--sd-red);
      background: var(--sd-chip);
    }
    .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.72rem 1.25rem;
      cursor: pointer;
      font-family: var(--font-primary);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary {
      background: var(--sd-red);
      color: white;
      box-shadow: 0 4px 0 var(--sd-red-deep), 0 10px 18px rgba(78, 10, 30, 0.18);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--sd-red-hi);
    }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; transform: none; box-shadow: none; }
    .btn-outline {
      background: white;
      color: var(--sd-navy);
      border: 2.4px solid var(--sd-navy);
      box-shadow: none;
    }
    .btn-outline:hover:not(:disabled) {
      background: var(--sd-navy);
      color: #fff;
    }
    .btn-outline:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn-red {
      background: var(--sd-red);
      color: white;
      box-shadow: 0 4px 0 var(--sd-red-deep);
    }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.1rem; }
    .composer-cta {
      margin-top: 1.15rem;
      padding-top: 0.85rem;
      border-top: 1px dashed color-mix(in srgb, var(--border-light) 90%, transparent);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .composer-cta .btn-primary { padding: 0.85rem 1.35rem; font-size: 1.02rem; }
    #printControls, #slideControls {
      display: inline-flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .type-size { display: inline-flex; gap: 0.35rem; }
    .type-size-btn { padding: 0.55rem 0.75rem; min-width: 2.6rem; justify-content: center; }
    .type-a { font-weight: 800; line-height: 1; }
    .type-a-sm { font-size: 0.82rem; }
    .type-a-lg { font-size: 1.2rem; }
    .is-hidden { display: none !important; }

    .status {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--sd-chip);
      color: var(--sd-navy);
      border: 1.6px solid var(--sd-chip-border);
      font-family: var(--font-body);
    }
    .status.show { display: block; }
    .status.error {
      background: rgba(200, 16, 46, 0.08);
      color: var(--sd-red);
      border-color: color-mix(in srgb, var(--sd-red) 28%, white);
    }
    .toolbar {
      display: none;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }
    .toolbar.show {
      display: flex;

  <script type="module">
    import {
      optionIndex,
      tfLabel,
      answerWord,
      formatChoiceAnswer,
      overlayLessonAnswers,
      scrambleBank,
      collocateColumns,
      clozeFillParts,
      gapFillParts,
      hasTypedGap,
      prepareLessonAnswers,
      prepareDeckAnswers,
    } from './lib/answers.js';
    import { insertAnswerSlides } from './lib/normalize-deck.js';
    import { t, taskLabel, tfWords, normalizeLanguage } from './lib/ui-strings.js';
    import { worksheetTaskOrder, expandGroupedTaskIds, parseTaskId, reindexAfterRemove, groupArrayKey } from './lib/lesson-prompt.js';
    import { lessonToDeck } from './lib/lesson-to-deck.js';
    import {
      splitIntro,
      stripSummaryCue,
      stripWriteTheLetter,
      exactAnswerBank,
      definitionText,
      definitionLetter,
      matchUsesLetters,
    } from './lib/lesson-display.js';
    import {
      listBrowserLessons,
      getBrowserLesson,
      saveBrowserLesson,
      deleteBrowserLesson,
      upsertBrowserLesson,
      dedupeBrowserLessons,
    } from './lib/browser-saved.js';
    import {
      loadGoogleDriveConfig,
      googleDriveConfigured,
      uploadBlobToDrive,
    } from './lib/google-drive.js';
    import {
      POLISH_PRIMARY_CLASSES,
      polishTaskPalette,
      subjectsForClass,
    } from './lib/polish-primary.js';
    import {
      resolvePolishSheetTheme,
      polishSheetDoodleHtml,
      applyPolishSheetThemeVars,
      clearPolishSheetThemeVars,
    } from './lib/polish-sheet-theme.js';
    import { applyLessonPath, editableText } from './lib/sheet-edit.js';
    import { extractYoutubeId, resolveMediaUrl, parseVideoEmbed } from './lib/video-embed.js';
    import {
      SLIDE_COLOUR_SCHEMES,
      themeNoteFromScheme,
      schemeLabel,
    } from './lib/slide-themes.js';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const LOGO = 'assets/lingospark-logo.png';
    let uiLang = normalizeLanguage(localStorage.getItem('lessonCreatorLang') || 'en');
    let contentLang = uiLang;
    let lastPayload = null;

    function ui(key) {
      return t(uiLang, key);
    }

    function tx(key) {
      return t(contentLang, key);
    }

    function applyUi() {
      document.documentElement.lang = uiLang === 'de' ? 'de' : uiLang === 'pl' ? 'pl' : 'en';
      document.title = ui('pageTitle');
      $('langEn').classList.toggle('active', uiLang === 'en');
      $('langDe').classList.toggle('active', uiLang === 'de');
      $('langPl').classList.toggle('active', uiLang === 'pl');
      $('composerEsl')?.classList.toggle('is-hidden', uiLang === 'pl');
      $('composerPl')?.classList.toggle('is-hidden', uiLang !== 'pl');
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = ui(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
        el.placeholder = ui(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-title]').forEach((el) => {
        const label = ui(el.dataset.i18nTitle);
        el.title = label;
        if (el.hasAttribute('aria-label')) el.setAttribute('aria-label', label);
      });
      document.querySelectorAll('#taskPicker input[name="wsTask"]').forEach((input) => {
        const span = input.parentElement.querySelector('.task-label');
        if (span) span.textContent = taskLabel(uiLang, input.value);
      });
      if (uiLang === 'pl') renderPolishPrimaryForm();
      syncSuggestionsModeUi();
    }

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.add('show');
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function ed(path, text, tag = 'span') {
      return editableText(path, text, { tag, multiline: tag === 'div' || tag === 'p' });
    }

    function lines(n = 2) {
      return `<div class="lines">${'<div></div>'.repeat(n)}</div>`;
    }

    function paragraphsHtml(text, list, editPrefix = '') {
      let paras = Array.isArray(list) && list.length
        ? list
        : String(text || '').trim().split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
      if (!paras.length && text) paras = [String(text)];
      const body = paras.map((p, i) => (
        editPrefix
          ? ed(`${editPrefix}.${i}`, p, 'p')
          : `<p>${escapeHtml(p)}</p>`
      )).join('');
      return `<div class="source-text">${body}</div>`;
    }

    function wants(tasks, id) {
      if (!tasks || !tasks.length) return true;
      if (tasks.includes(id)) return true;
      return tasks.some((t) => parseTaskId(t).base === id);
    }

    function selectedTasks() {
      return [...document.querySelectorAll('input[name="wsTask"]:checked')].map((el) => el.value);
    }

    function readAdaptTarget() {
      if (!$('adapt')?.checked) return null;
      const mode = document.querySelector('input[name="adaptMode"]:checked')?.value === 'words' ? 'words' : 'minutes';
      if (mode === 'words') {
        return {
          mode: 'words',
          minWords: Number($('adaptWordsMin')?.value) || 300,
          maxWords: Number($('adaptWordsMax')?.value) || 500,
        };
      }
      return {
        mode: 'minutes',
        minutes: Number($('adaptMinutes')?.value) || 4.5,
      };
    }

    function syncAdaptOptionsUi() {
      const open = Boolean($('adapt')?.checked);
      $('adaptOptions')?.classList.toggle('is-open', open);
      const mode = document.querySelector('input[name="adaptMode"]:checked')?.value || 'minutes';
      $('adaptMinutesField')?.classList.toggle('is-hidden', mode !== 'minutes');
      $('adaptWordsField')?.classList.toggle('is-hidden', mode !== 'words');
    }

    function syncSuggestionsModeUi({ applyDefaults = false } = {}) {
      const on = Boolean($('suggestionsOnly')?.checked);
      $('suggestionsPanel')?.classList.toggle('is-hidden', !on);
      $('sourceFields')?.classList.toggle('is-dimmed', on);
      const topicLabel = document.querySelector('label[for="topic"]');
      const topicInput = $('topic');
      if (topicLabel && topicInput) {
        if (on) {
          topicLabel.setAttribute('data-i18n', 'topicThemeLabel');
          topicLabel.textContent = ui('topicThemeLabel');
          topicInput.setAttribute('data-i18n-placeholder', 'topicThemePlaceholder');
          topicInput.placeholder = ui('topicThemePlaceholder');
        } else {
          topicLabel.setAttribute('data-i18n', 'topicLabel');
          topicLabel.textContent = ui('topicLabel');
          topicInput.setAttribute('data-i18n-placeholder', 'topicPlaceholder');
          topicInput.placeholder = ui('topicPlaceholder');
        }
      }
      if (on && applyDefaults) {
        // Practice sheets usually skip a long reading passage unless the teacher wants one.
        if ($('includeTextWorksheet')) $('includeTextWorksheet').checked = false;
        if ($('adapt')) {
          $('adapt').checked = false;
          syncAdaptOptionsUi();
        }
      }
    }

    function prepareSheetView(sheet) {
      if (sheet.querySelector('.sheet-body')) return;
      sheet.innerHTML = `<div class="sheet-body">${sheet.innerHTML}</div>`;
    }

    function renderLesson(payload) {
      contentLang = normalizeLanguage(payload.language || payload.lesson?.language || uiLang);
      payload.lesson = prepareLessonAnswers(payload.lesson, payload.source?.text);
      const lesson = payload.lesson;
      const source = payload.source || {};
      const removed = new Set(payload.removedTasks || []);
      const tasks = (payload.tasks || lesson.includedTasks || []).filter((id) => !removed.has(id));
      const vocabRows = (lesson.vocabulary || []).map((item, i) =>
        `<tr><td>${ed(`vocabulary.${i}.word`, item.word)}</td><td>${ed(`vocabulary.${i}.definition`, item.definition)}</td></tr>`
      ).join('');

      const isCombinedEarly = lesson.skill === 'combined' || Boolean(source.combinedSources);
      const sourceFocusCue = (focus) => {
        if (!isCombinedEarly) return '';
        const f = String(focus || '').toLowerCase();
        if (f === 'video' || f === 'listening' || f === 'listen') {
          return `<span class="source-focus">${escapeHtml(tx('fromVideo'))}</span> `;
        }
        if (f === 'reading' || f === 'text' || f === 'read') {
          return `<span class="source-focus">${escapeHtml(tx('fromReading'))}</span> `;
        }
        return '';
      };

      const gap = lesson.comprehension?.gapFill || {};
      const gapAnswers = (gap.answers || []).map((a) => answerWord(a));
      const bank = scrambleBank(exactAnswerBank(gapAnswers.length ? gapAnswers : gap.wordBank), gap.answers).map((w) => `<span class="chip">${escapeHtml(w)}</span>`).join('');
      const gapAnswerLine = gapAnswers.map((a, i) => `${i + 1}. ${ed(`comprehension.gapFill.answers.${i}`, a)}`).join(' · ');
      const gapFocusCue = sourceFocusCue(gap.sourceFocus);

      const mc = (lesson.comprehension?.multipleChoice || []).map((q, qi) => `
        <li>
          ${sourceFocusCue(q.sourceFocus)}${ed(`comprehension.multipleChoice.${qi}.question`, q.question)}
          <div class="options">${(q.options || []).map((opt, idx) =>
            `${String.fromCharCode(65 + idx)}) ${ed(`comprehension.multipleChoice.${qi}.options.${idx}`, opt)}`
          ).join('<br>')}</div>
          ${lines(1)}
          <div class="answer">${tx('answer')} ${ed(`comprehension.multipleChoice.${qi}.answer`, formatChoiceAnswer(q))}</div>
        </li>
      `).join('');

      const tfPair = tfWords(contentLang);
      const tf = (lesson.comprehension?.trueFalse || []).map((item, ti) => {
        const label = tfLabel(item.answer);
        const ansLabel = label === 'True' ? tfPair.true : label === 'False' ? tfPair.false : '';
        const correction = label === 'False' && item.correction
          ? ` — ${ed(`comprehension.trueFalse.${ti}.correction`, item.correction)}`
          : '';
        return `
        <div class="tf-item">
          ${sourceFocusCue(item.sourceFocus)}${ed(`comprehension.trueFalse.${ti}.statement`, item.statement)} &nbsp; <span class="tf-true">${tfPair.true}</span> / <span class="tf-false">${tfPair.false}</span>
          ${lines(1)}
          <div class="answer">${ed(`comprehension.trueFalse.${ti}.answer`, ansLabel)}${correction}</div>
        </div>`;
      }).join('');

      const open = (lesson.comprehension?.openEnded || []).map((item, oi) => `
        <div class="open-item">
          ${sourceFocusCue(item.sourceFocus)}${ed(`comprehension.openEnded.${oi}.question`, item.question)}
          ${lines(3)}
          <div class="answer">${tx('sample')} ${ed(`comprehension.openEnded.${oi}.sampleAnswer`, item.sampleAnswer || '')}</div>
        </div>
      `).join('');

      let n = 0;
      const step = (body) => {
        const html = String(body).trim();
        const m = html.match(/^<p(\s[^>]*)?>([\s\S]*?)<\/p>([\s\S]*)$/);
        if (m) {
          const attrs = m[1] || '';
          const nextAttrs = /class=/.test(attrs)
            ? attrs.replace(/class="/, 'class="task-head ')
            : `${attrs} class="task-head"`;
          return `<div class="task"><p${nextAttrs}><span class="n">${++n}.</span> ${m[2]}</p>${m[3]}</div>`;
        }
        return `<div class="task"><p class="task-head"><span class="n">${++n}.</span></p>${html}</div>`;
      };

      const taskBlock = (id, bodies) => {
        const html = (Array.isArray(bodies) ? bodies : [bodies]).filter(Boolean).map(step).join('');
        if (!html) return '';
        return `<div class="task-block" data-task="${id}">
          <div class="task-reorder">
            <button type="button" class="task-move" data-task="${id}" data-dir="up" title="${escapeHtml(ui('taskMoveUp'))}" aria-label="${escapeHtml(ui('taskMoveUp'))}"><i class="fa-solid fa-chevron-up"></i></button>
            <button type="button" class="task-move" data-task="${id}" data-dir="down" title="${escapeHtml(ui('taskMoveDown'))}" aria-label="${escapeHtml(ui('taskMoveDown'))}"><i class="fa-solid fa-chevron-down"></i></button>
            <button type="button" class="task-remove" data-task="${id}" title="${escapeHtml(ui('taskRemove'))}" aria-label="${escapeHtml(ui('taskRemove'))}"><i class="fa-solid fa-xmark"></i></button>
          </div>
          ${html}
        </div>`;
      };

      const vocabTaskBodies = (lesson.vocabBuilding || []).map((task, ti) => {
        if (task.kind === 'match') {
          const cols = collocateColumns(task.items || []);
          const left = cols.words.map((w, i) => `<li>${ed(`vocabBuilding.${ti}.items.${i}.prompt`, w)}</li>`).join('');
          const right = cols.definitions.map((p, i) => `<li>${ed(`vocabBuilding.${ti}.items.${i}.answer`, p)}</li>`).join('');
          const keyLine = cols.answers.map((a, i) => `${i + 1}–${ed(`vocabBuilding.${ti}.items.${i}.answer`, a)}`).join(' &nbsp; ');
          return `<p>${ed(`vocabBuilding.${ti}.instruction`, stripWriteTheLetter(task.instruction) || tx('collocateFallback'))}</p>
          <div class="match-grid">
            <ol>${left}</ol>
            <ul>${right}</ul>
          </div>
          <div class="answer">${tx('answers')} ${keyLine}</div>`;
        }
        const items = (task.items || []).map((it, ii) => `
          <li>
            ${ed(`vocabBuilding.${ti}.items.${ii}.prompt`, it.prompt)}
            ${lines(task.kind === 'sentence' ? 2 : 1)}
            <div class="answer">${ed(`vocabBuilding.${ti}.items.${ii}.answer`, it.answer || '')}</div>
          </li>
        `).join('');
        return `<p>${ed(`vocabBuilding.${ti}.instruction`, task.instruction)}</p><ol class="q">${items}</ol>`;
      });

      const renderVocabActivity = (ti) => {
        const body = vocabTaskBodies[ti];
        return body ? taskBlock(`vocabBuild:${ti}`, body) : '';
      };

      const renderGrammarActivity = (gi) => {
        const task = (lesson.grammarPractice || [])[gi];
        if (!task) return '';
        const kind = String(task.kind || '').toLowerCase();
        const items = (task.items || []).map((it, i) => {
          const prompt = it.prompt || it.sentence || '';
          const opts = (it.options || []).map((o, j) => `${String.fromCharCode(65 + j)}) ${ed(`grammarPractice.${gi}.items.${i}.options.${j}`, o)}`).join(' &nbsp; ');
          const keyText = (it.options || []).length
            ? formatChoiceAnswer(it)
            : answerWord(it.answer);
          const lineCount = (kind === 'rewrite' || kind === 'error' || kind === 'sentence') ? 2 : 1;
          return `<div class="open-item">${i + 1}. ${ed(`grammarPractice.${gi}.items.${i}.prompt`, prompt)}
            ${opts ? `<p>${opts}</p>` : ''}
            ${lines(lineCount)}
            <div class="answer">${ed(`grammarPractice.${gi}.items.${i}.answer`, keyText)}</div>
          </div>`;
        }).join('');
        if (!items && !(task.instruction || '').trim()) return '';
        return taskBlock(`grammar:${gi}`, `<p>${ed(`grammarPractice.${gi}.instruction`, task.instruction || tx('grammarFallback'))}</p>${items}`);
      };

      const discussion = (lesson.discussion || []).map((q, di) =>
        `<div class="open-item">${ed(`discussion.${di}`, typeof q === 'string' ? q : (q.prompt || q.question || ''))}${lines(3)}</div>`
      ).join('');

      const preItems = lesson.preReading?.items
        || (lesson.warmUp?.prompt ? [{ prompt: lesson.warmUp.prompt }] : []);
      const preBlock = preItems.map((item, pi) =>
        `<p>${ed(`preReading.items.${pi}.prompt`, item.prompt || item)}</p>${lines(3)}`
      ).join('');

      const includeOnSheet = payload.includeSourceOnWorksheet !== false;
      const isCombined = isCombinedEarly;
      const showText = includeOnSheet && lesson.showSourceToStudents !== false && (lesson.skill !== 'listening' || isCombined);
      const showListen = includeOnSheet && (lesson.skill === 'listening' || isCombined);
      const sourceLine = stripSummaryCue(lesson.sourceInstruction)
        || (isCombined
          ? tx('combinedSourceFallback')
          : (lesson.skill === 'listening' ? tx('listenFallback') : tx('sourceReadFallback')));
      const sourceHtml = paragraphsHtml(lesson.sourceText, lesson.sourceParagraphs, 'sourceParagraphs');
      const mediaUrl = resolveMediaUrl(source, lesson)
        || resolveMediaUrl({ url: source.videoUrl || '' }, lesson);
      if (mediaUrl) {
        if (!source.url) source.url = mediaUrl;
        if (!lesson.sourceUrl) lesson.sourceUrl = mediaUrl;
        const yid = extractYoutubeId(mediaUrl) || extractYoutubeId(source.youtubeId) || extractYoutubeId(lesson.youtubeId);
        if (yid) {
          source.youtubeId = source.youtubeId || yid;
          lesson.youtubeId = lesson.youtubeId || yid;
        }
      }
      const listenBox = showListen
        ? `<div class="listen-box">${ed('sourceInstruction', isCombined ? tx('listenFallback') : sourceLine)}${mediaUrl ? `<br>${tx('sourceLabel')} <span class="sheet-edit source-media-link" data-edit="sourceUrl" contenteditable="true" spellcheck="false">${escapeHtml(mediaUrl)}</span> <a class="source-media-open no-print" href="${escapeHtml(mediaUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(mediaUrl)}">↗</a>` : ''}</div>`
        : '';
      const sourceBlock = isCombined
        ? `${listenBox}${showText ? sourceHtml : ''}`
        : (showText ? sourceHtml : listenBox);

      const cloze = lesson.cloze || {};
      const clozeOpts = (cloze.items || []).map((item, i) => {
        const opts = (item.options || []).map((o, j) => `${String.fromCharCode(65 + j)}) ${ed(`cloze.items.${i}.options.${j}`, o)}`).join(' &nbsp; ');
        return `<p>(${ed(`cloze.items.${i}.blank`, item.blank || '')}) ${opts}</p><div class="answer">${tx('answer')} ${ed(`cloze.items.${i}.answer`, formatChoiceAnswer(item))}</div>`;
      }).join('');

      const wb = lesson.wordBankTask || {};
      const wbChips = scrambleBank(wb.wordBank || [], wb.answers).map((w) => `<span class="chip">${escapeHtml(w)}</span>`).join('');
      const wbSentences = (wb.sentences || []).map((line, i) =>
        `<div class="open-item">${i + 1}. ${ed(`wordBankTask.sentences.${i}`, line)}${lines(1)}<div class="answer">${ed(`wordBankTask.answers.${i}`, answerWord((wb.answers || [])[i] || ''))}</div></div>`
      ).join('');

      const scen = lesson.scenario || {};
      const deb = lesson.debate || {};
      const ref = lesson.reflection || {};
      const gw = lesson.guidedWriting || {};
      const gwBullets = gw.bullets || gw.checklist || [];
      const match = lesson.vocabMatch || {};
      const wf = lesson.wordFormation || {};
      const wfItemsRaw = (wf.items || []).length
        ? wf.items
        : (wf.sentences || []).map((s, i) => ({ sentence: s, answer: (wf.answers || [])[i] }));
      const hyp = lesson.whatIf || {};

      const builders = {
        intro: () => {
          const linesIntro = splitIntro(lesson.introduction);
          if (!linesIntro.length) return '';
          return taskBlock('intro', linesIntro.map((line, i) => `<p class="intro">${ed(`introduction.${i}`, line)}</p>`).join(''));
        },
        vocab: () => vocabRows ? taskBlock('vocab', `<p>${tx('vocabNeed')}</p>
          <div class="vocab-wrap">
          <table class="vocab">
            <thead><tr><th>${tx('vocabWord')}</th><th>${tx('vocabMeaning')}</th></tr></thead>
            <tbody>${vocabRows}</tbody>
          </table>
          </div>`) : '',
        preReading: () => (lesson.preReading?.instruction || preItems.length)
          ? taskBlock('preReading', `<p>${ed('preReading.instruction', lesson.preReading?.instruction || lesson.warmUp?.instruction || tx('preReadFallback'))}</p>${preBlock}`)
          : '',
        source: () => includeOnSheet
          ? taskBlock('source', `<p>${ed('sourceInstruction', sourceLine)}</p>${sourceBlock}`)
          : '',
        gapFill: () => (gap.text || bank) ? taskBlock('gapFill', `<p>${gapFocusCue}${ed('comprehension.gapFill.instruction', gap.instruction || tx('gapFallback'))}</p>
          <div class="bank">${bank}</div>
          <div class="source-text">${ed('comprehension.gapFill.text', gap.text || '', 'div')}</div>
          <div class="answer">${tx('answers')} ${gapAnswerLine}</div>`) : '',
        mcq: () => mc ? taskBlock('mcq', `<p>${tx('mcqPrompt')}</p><ol class="q">${mc}</ol>`) : '',
        tf: () => tf ? taskBlock('tf', `<p>${tx('tfPrompt')}</p>${tf}`) : '',
        open: () => open ? taskBlock('open', `<p>${tx('openPrompt')}</p>${open}`) : '',
        vocabBuild: () => '',
        vocabMatch: () => ((match.words || []).length || (match.definitions || []).length) ? taskBlock('vocabMatch', (() => {
          const wordList = (match.words || []).map((w, i) => `<li>${ed(`vocabMatch.words.${i}`, w)}</li>`).join('');
          const defList = (match.definitions || []).map((d, i) => {
            const letter = typeof d === 'string' ? '' : (d.letter || '');
            const text = typeof d === 'string' ? d : (d.text || d.definition || '');
            const path = typeof d === 'string' ? `vocabMatch.definitions.${i}` : `vocabMatch.definitions.${i}.text`;
            return `<li><strong>${escapeHtml(letter)}.</strong> ${ed(path, text)}</li>`;
          }).join('');
          const keyLine = (match.answers || []).map((a, i) => `${i + 1}–${ed(`vocabMatch.answers.${i}`, a)}`).join(' &nbsp; ');
          const blanks = (match.words || []).map((_, i) => `${i + 1} ___`).join(' &nbsp; ');
          return `<p>${ed('vocabMatch.instruction', match.instruction || tx('matchFallback'))}</p>
          <div class="match-grid">
            <ol>${wordList}</ol>
            <ul>${defList}</ul>
          </div>
          <p class="match-key">${blanks}</p>
          <div class="answer">${tx('answers')} ${keyLine}</div>`;
        })()) : '',
        wordFormation: () => wfItemsRaw.length ? taskBlock('wordFormation', (() => {
          const wfItems = wfItemsRaw.map((it, i) => {
            const sentence = it.sentence || '';
            const prompt = it.prompt && !sentence.includes(it.prompt) ? ` (${ed(`wordFormation.items.${i}.prompt`, it.prompt)})` : '';
            return `
          <div class="open-item">${i + 1}. ${ed(`wordFormation.items.${i}.sentence`, sentence)}${prompt}
            ${lines(1)}
            <div class="answer">${ed(`wordFormation.items.${i}.answer`, answerWord(it.answer || (wf.answers || [])[i] || ''))}</div>
          </div>`;
          }).join('');
          return `<p>${ed('wordFormation.instruction', wf.instruction || tx('wordFormFallback'))}</p>${wfItems}`;
        })()) : '',
        whatIf: () => ((hyp.items || []).length || (hyp.prompts || []).length) ? taskBlock('whatIf', (() => {
          const hypItems = (hyp.items || hyp.prompts || []).map((it, i) => {
            const prompt = typeof it === 'string' ? it : (it.prompt || it.question || '');
            const sample = typeof it === 'string' ? '' : (it.sampleAnswer || '');
            const path = Array.isArray(hyp.items) ? `whatIf.items.${i}.prompt` : `whatIf.prompts.${i}`;
            return `<div class="open-item">${i + 1}. ${ed(path, prompt)}${lines(3)}<div class="answer">${ed(`whatIf.items.${i}.sampleAnswer`, sample)}</div></div>`;
          }).join('');
          return `<p>${ed('whatIf.instruction', hyp.instruction || tx('whatIfFallback'))}</p>${hypItems}`;
        })()) : '',
        cloze: () => (cloze.text || clozeOpts) ? taskBlock('cloze', `<p>${ed('cloze.instruction', cloze.instruction || tx('clozeFallback'))}</p>
          <div class="source-text">${ed('cloze.text', cloze.text || '', 'div')}</div>
          ${clozeOpts}`) : '',
        wordBank: () => (wbSentences || wbChips) ? taskBlock('wordBank', `<p>${ed('wordBankTask.instruction', wb.instruction || tx('wordBankFallback'))}</p>
          <div class="bank">${wbChips}</div>${wbSentences}`) : '',
        grammar: () => '',
        reflection: () => (ref.quote || ref.question) ? taskBlock('reflection', `<p class="intro">${ref.quote ? `“${ed('reflection.quote', ref.quote)}”` : ''}</p>
          <p>${ed('reflection.question', ref.question || '')}</p>${lines(3)}`) : '',
        guidedWriting: () => (gw.instruction || gwBullets.length) ? taskBlock('guidedWriting', (() => {
          const bullets = gwBullets.map((b, i) => {
            const text = typeof b === 'string' ? b : (b.prompt || b.text || '');
            const path = Array.isArray(gw.bullets) ? `guidedWriting.bullets.${i}` : `guidedWriting.checklist.${i}`;
            return `<li>${ed(path, text)}</li>`;
          }).join('');
          return `<p>${ed('guidedWriting.instruction', gw.instruction || tx('guidedWritingFallback'))}</p>
            ${bullets ? `<ul class="gw-bullets">${bullets}</ul>` : ''}
            ${lines(14)}
            <div class="answer">${tx('sample')} ${ed('guidedWriting.sampleAnswer', gw.sampleAnswer || '', 'div')}</div>`;
        })()) : '',
        scenario: () => (scen.dilemma || scen.optionA) ? taskBlock('scenario', `<p>${ed('scenario.dilemma', scen.dilemma || '')}</p>
          <div class="choice-pair">
            <div class="choice-card"><strong>${tx('optionA')}</strong>${ed('scenario.optionA', scen.optionA || '')}</div>
            <div class="choice-card con"><strong>${tx('optionB')}</strong>${ed('scenario.optionB', scen.optionB || '')}</div>
          </div>
          <p style="margin-top:0.6rem">${ed('scenario.task', scen.task || tx('scenarioTask'))}</p>${lines(3)}`) : '',
        debate: () => (deb.thesis || (deb.pro || []).length) ? taskBlock('debate', `<p>${ed('debate.thesis', deb.thesis || '')}</p>
          <div class="choice-pair">
            <div class="choice-card"><strong>${tx('teamPro')}</strong>${(deb.pro || []).map((p, i) => `<p>${ed(`debate.pro.${i}`, p)}</p>`).join('')}</div>
            <div class="choice-card con"><strong>${tx('teamCon')}</strong>${(deb.con || []).map((p, i) => `<p>${ed(`debate.con.${i}`, p)}</p>`).join('')}</div>
          </div>
          ${lines(3)}`) : '',
        discussion: () => discussion ? taskBlock('discussion', `<p>${tx('discussionPrompt')}</p>${discussion}`) : '',
      };

      const practiceKindLabel = (kind) => {
        const map = {
          calculate: 'practiceKindCalculate',
          measure: 'practiceKindMeasure',
          draw: 'practiceKindDraw',
          construct: 'practiceKindConstruct',
          wordproblem: 'practiceKindWordProblem',
          table: 'practiceKindTable',
          scramble: 'practiceKindScramble',
          rozsypywanka: 'practiceKindScramble',
        };
        const key = map[String(kind || '').toLowerCase()];
        return key ? tx(key) : '';
      };

      const renderPracticeActivity = (bi) => {
        const blocks = Array.isArray(lesson.practiceExercises) ? lesson.practiceExercises : [];
        const block = blocks[bi];
        if (!block || removed.has('practice') || removed.has(`practice:${bi}`)) return '';
        const kind = block.kind || '';
        const label = practiceKindLabel(kind);
        const items = (block.items || []).map((it, i) => {
          const prompt = typeof it === 'string' ? it : (it.prompt || it.question || '');
          const answer = typeof it === 'string' ? '' : (it.answer || '');
          const k = String(kind).toLowerCase();
          const space = typeof it === 'string' ? '' : String(it.space || '').toLowerCase();
          const lineCount = (k === 'draw' || k === 'construct' || k === 'table' || space === 'draw' || space === 'grid')
            ? 5
            : (k === 'wordproblem' ? 3 : 2);
          const promptPath = typeof it === 'string'
            ? `practiceExercises.${bi}.items.${i}`
            : `practiceExercises.${bi}.items.${i}.prompt`;
          return `<div class="pl-practice-item">
            <div>${i + 1}. ${ed(promptPath, prompt)}</div>
            ${lines(lineCount)}
            <div class="answer">${tx('answer')} ${ed(`practiceExercises.${bi}.items.${i}.answer`, answer)}</div>
          </div>`;
        }).join('');
        const head = label
          ? `<span class="pl-practice-kind">${escapeHtml(label)}</span> ${ed(`practiceExercises.${bi}.instruction`, block.instruction || tx('practiceFallback'))}`
          : ed(`practiceExercises.${bi}.instruction`, block.instruction || tx('practiceFallback'));
        if (!items && !(block.instruction || '').trim()) return '';
        return taskBlock(`practice:${bi}`, `<p>${head}</p>${items}`);
      };

      let order = worksheetTaskOrder(tasks, {
        includeSource: includeOnSheet,
        preserveOrder: Boolean(payload.taskOrderCustom)
          || tasks.some((id) => parseTaskId(id).index != null),
      });
      order = expandGroupedTaskIds(order, lesson, removed);
      const buildersWithPractice = {
        ...builders,
        practice: () => '',
      };
      const parts = [];
      const shown = [];
      for (const id of order) {
        const { base, index } = parseTaskId(id);
        let html = '';
        if (base === 'vocabBuild' && index != null) html = renderVocabActivity(index);
        else if (base === 'grammar' && index != null) html = renderGrammarActivity(index);
        else if (base === 'practice' && index != null) html = renderPracticeActivity(index);
        else if (base === 'practice') {
          const n = (lesson.practiceExercises || []).length;
          for (let i = 0; i < n; i += 1) {
            const blockHtml = renderPracticeActivity(i);
            if (blockHtml) {
              parts.push(blockHtml);
              shown.push(`practice:${i}`);
            }
          }
          continue;
        } else {
          html = buildersWithPractice[base]?.() || buildersWithPractice[id]?.();
        }
        if (html) {
          parts.push(html);
          shown.push(id);
        }
      }
      if (!shown.some((id) => parseTaskId(id).base === 'practice') && !removed.has('practice')) {
        const n = (lesson.practiceExercises || []).length;
        const practiceParts = [];
        for (let i = 0; i < n; i += 1) {
          const blockHtml = renderPracticeActivity(i);
          if (blockHtml) practiceParts.push({ id: `practice:${i}`, html: blockHtml });
        }
        if (practiceParts.length) {
          const afterOpen = shown.indexOf('open');
          const afterMcq = shown.indexOf('mcq');
          const beforeRefl = shown.indexOf('reflection');
          let insertAt = parts.length;
          if (afterOpen >= 0) insertAt = afterOpen + 1;
          else if (afterMcq >= 0) insertAt = afterMcq + 1;
          else if (beforeRefl >= 0) insertAt = beforeRefl;
          practiceParts.forEach((row, offset) => {
            parts.splice(insertAt + offset, 0, row.html);
            shown.splice(insertAt + offset, 0, row.id);
          });
        }
      }
      payload.tasks = shown;
      payload.includeSourceOnWorksheet = includeOnSheet;
      if (lesson) {
        lesson.includedTasks = shown.filter((id) => {
          const { base } = parseTaskId(id);
          return base !== 'source' && base !== 'practice';
        });
      }
      lastPayload = payload;
      if (payload.topicImageChoices?.length && lesson && !lesson.topicImageChoices?.length) {
        lesson.topicImageChoices = payload.topicImageChoices;
      }
      if (lesson?.topicImageChoices?.length && !payload.topicImageChoices?.length) {
        payload.topicImageChoices = lesson.topicImageChoices;
      }

      const topicImage = lesson.topicImage || payload.topicImage;
      const topicChoices = (
        lesson.topicImageChoices
        || payload.topicImageChoices
        || []
      ).filter((img) => img?.dataUrl);
      const selectedKey = topicImage?.id
        || topicImage?.sourceUrl
        || (topicImage?.dataUrl ? topicImage.dataUrl.slice(0, 96) : '');
      const topicPicker = `<div class="topic-image-picker no-print" data-topic-picker>
            <h3>${escapeHtml(tx('topicImagePick'))}</h3>
            <p>${escapeHtml(tx('topicImagePickHint'))}</p>
            ${topicChoices.length ? `<div class="topic-image-choices">
              ${topicChoices.map((img, i) => {
                const key = img.id || img.sourceUrl || img.dataUrl.slice(0, 96);
                const selected = key === selectedKey || (!selectedKey && i === 0);
                return `<button type="button" class="topic-image-choice${selected ? ' is-selected' : ''}" data-topic-choice="${i}" aria-pressed="${selected ? 'true' : 'false'}" title="${escapeHtml(img.alt || '')}">
                  <img src="${img.dataUrl}" alt="${escapeHtml(img.alt || '')}">
                </button>`;
              }).join('')}
            </div>` : ''}
            <div class="topic-image-search">
              <input type="text" id="topicImageQuery" data-i18n-placeholder="topicImageSearchHint" placeholder="${escapeHtml(ui('topicImageSearchHint'))}" value="${escapeHtml(lesson.imageSearch || '')}">
              <button type="button" class="btn btn-outline" id="topicImageSearchBtn">${escapeHtml(ui('topicImageSearch'))}</button>
            </div>
            <div class="topic-image-actions">
              <input type="url" id="topicImageUrlInput" data-i18n-placeholder="topicImageUrlHint" placeholder="${escapeHtml(ui('topicImageUrlHint'))}" aria-label="${escapeHtml(ui('topicImageUrl'))}">
              <button type="button" class="btn btn-outline" id="topicImageUrlBtn">${escapeHtml(ui('topicImageUrlAdd'))}</button>
              <label class="btn btn-outline" style="margin:0;cursor:pointer">
                <span>${escapeHtml(ui('topicImageFile'))}</span>
                <input type="file" id="topicImageFileInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
              </label>
              ${topicImage?.dataUrl ? `<button type="button" class="btn btn-outline" id="topicImageRemoveBtn">${escapeHtml(ui('topicImageRemove'))}</button>` : ''}
            </div>
          </div>`;
      const topicFigure = topicImage?.dataUrl

    function normalizeEditedAnswer(path, value) {
      const p = String(path || '');
      const raw = value;
      if (/multipleChoice\.\d+\.answer$/.test(p)
        || /cloze\.items\.\d+\.answer$/.test(p)
        || /grammarPractice\.\d+\.items\.\d+\.answer$/.test(p)) {
        const m = String(raw ?? '').trim().match(/^([A-Ha-h])(?:[).:\s]|$)/);
        if (m) return m[1].toUpperCase();
      }
      if (/trueFalse\.\d+\.answer$/.test(p)) {
        const s = String(raw ?? '').trim().toLowerCase();
        if (/^(true|t|yes|prawda|p|wahr|w)\b/i.test(s)) return true;
        if (/^(false|f|no|fa[lł]sz|nie|falsch)\b/i.test(s)) return false;
      }
      return raw;
    }

    function bindSheetEditing(sheet) {
      if (!sheet || !lastPayload?.lesson) return;
      sheet.querySelectorAll('[data-edit]').forEach((el) => {
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey && el.getAttribute('data-multiline') !== '1' && el.tagName !== 'DIV') {
            e.preventDefault();
            el.blur();
          }
        });
        el.addEventListener('blur', () => {
          const path = el.getAttribute('data-edit');
          if (!path || !lastPayload?.lesson) return;
          let value = (el.innerText || '').replace(/\u00a0/g, ' ').trim();
          value = normalizeEditedAnswer(path, value);
          if (typeof value === 'boolean') {
            el.textContent = value
              ? (tfWords(contentLang).true)
              : (tfWords(contentLang).false);
          } else if (/multipleChoice\.\d+\.answer$/.test(path)
            || /cloze\.items\.\d+\.answer$/.test(path)
            || /grammarPractice\.\d+\.items\.\d+\.answer$/.test(path)) {
            const letter = String(value || '').trim();
            if (/^[A-H]$/i.test(letter)) {
              // Keep letter visible; full option text redraws on next render.
              el.textContent = letter.toUpperCase();
              value = letter.toUpperCase();
            }
          }
          const changed = applyLessonPath(lastPayload.lesson, path, value);
          if (path === 'sourceUrl') {
            if (!lastPayload.source) lastPayload.source = {};
            lastPayload.source.url = value;
            lastPayload.lesson.sourceUrl = value;
            const yid = extractYoutubeId(value);
            if (yid) {

            const open = el.parentElement?.querySelector?.('.source-media-open');
            if (open) open.setAttribute('href', value || '#');

            updateSaveWorksheetBtn();
            return;
          }
          if (!changed) return;
          if (path === 'title') lastLessonTitle = value;
          clearPresentation();
          updateSaveWorksheetBtn();
          updateLingoSparkVocabBtn();
        });
      });
    }

    const LINGOSPARK_WORDSET_URL = 'https://www.lingospark.study/#/mysets';

    function collectLessonGlossary(lesson) {
      const seen = new Set();
      const out = [];
      const add = (term, def) => {
        const t = String(term || '').trim();
        const d = String(def || '').trim();
        if (!t || !d) return;
        const key = t.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ term: t, def: d });
      };

      const primary = lesson?.lingoSparkList || [];
      for (const item of primary) {
        add(item?.word || item?.term, item?.definition || item?.def || item?.meaning);
      }

      // Older saved worksheets: fall back to pre-teach + vocab match only if the dedicated list is missing.
      if (!out.length) {
        for (const item of lesson?.vocabulary || []) {
          add(item?.word, item?.definition);
        }
        const match = lesson?.vocabMatch || {};
        const words = match.words || [];
        const defs = match.definitions || [];
        const answers = match.answers || [];
        const defByLetter = new Map();
        defs.forEach((d, i) => {
          const letter = String(
            typeof d === 'string' ? String.fromCharCode(65 + i) : (d.letter || String.fromCharCode(65 + i))
          ).trim().toUpperCase();
          const text = typeof d === 'string' ? d : (d.text || d.definition || '');
          if (letter) defByLetter.set(letter, text);
        });
        words.forEach((w, i) => {
          const letter = String(answers[i] || '').trim().toUpperCase();
          add(w, defByLetter.get(letter) || '');
        });
      }

      return out;
    }

    function formatLingoSparkGlossary(pairs) {
      return (pairs || [])
        .map((p) => `${p.term} = ${p.def}`)
        .join('\n');
    }

    async function refreshSavedList() {
      const list = $('savedList');
      if (!list) return;
      try {
        // Browser IndexedDB is the durable store (Render free disk is wiped on redeploy).
        // Import any newer server copies when available.
        let localItems = [];
        try {
          localItems = await listBrowserLessons();
        } catch {
          localItems = [];
        }
        try {
          const res = await fetch('api/saved-lessons');
          if (res.ok) {
            const data = await res.json();
            for (const item of data.items || []) {
              const local = localItems.find((row) => row.id === item.id);
              if (local && String(local.updatedAt || '') >= String(item.updatedAt || '')) continue;
              try {
                const full = await fetch(`api/saved-lessons/${encodeURIComponent(item.id)}`);
                if (!full.ok) continue;
                const record = await full.json();
                if (record?.payload?.lesson) {
                  await upsertBrowserLesson({
                    id: record.id,
                    title: record.title,
                    savedAt: record.savedAt,
                    updatedAt: record.updatedAt,
                    payload: record.payload,
                  });
                }
              } catch {
                /* skip one bad server item */
              }
            }
          }
        } catch {
          /* server optional */
        }

        let removedDupes = [];
        try {
          removedDupes = await dedupeBrowserLessons();
        } catch {
          removedDupes = [];
        }
        // Drop matching server copies that were duplicate local rows.
        for (const id of removedDupes) {
          try {
            await fetch(`api/saved-lessons/${encodeURIComponent(id)}`, { method: 'DELETE' });
          } catch {
            /* ignore */
          }
        }

        const items = await listBrowserLessons();
        if (!items.length) {
          list.innerHTML = `<p class="saved-empty">${escapeHtml(ui('savedEmpty'))}</p>`;
          return;
        }
        list.innerHTML = items.map((item) => {
          const bits = [item.cefr, item.skill, formatSavedWhen(item.updatedAt)].filter(Boolean).join(' · ');
          return `<div class="saved-item" data-id="${escapeHtml(item.id)}">
            <div class="saved-meta">
              <strong>${escapeHtml(item.title || 'Lesson')}</strong>
              <span>${escapeHtml(bits)}</span>
            </div>
            <div class="saved-actions">
              <button type="button" class="btn btn-outline saved-open">${escapeHtml(ui('savedOpen'))}</button>
              <button type="button" class="btn btn-outline saved-delete">${escapeHtml(ui('savedDelete'))}</button>
            </div>
          </div>`;
        }).join('');
        list.querySelectorAll('.saved-open').forEach((btn) => {
          btn.onclick = () => openSavedLesson(btn.closest('.saved-item')?.dataset.id);
        });
        list.querySelectorAll('.saved-delete').forEach((btn) => {
          btn.onclick = () => deleteSavedLesson(btn.closest('.saved-item')?.dataset.id);
        });
      } catch (err) {
        list.innerHTML = `<p class="saved-empty">${escapeHtml(err.message || ui('errLoad'))}</p>`;
      }
    }

      if (savingWorksheet) return;
      const payload = currentSavePayload();
      if (!payload) {
        setStatus(ui('statusNeedSheet'), true);
        return;
      }
      const suggested = lastLessonTitle || payload.lesson.title || 'Lesson';
      // Re-saving the open worksheet updates the same copy (no rename prompt).
      let title = suggested;
      if (!lastSavedId) {
        const named = window.prompt(ui('savedRenamePrompt'), suggested);
        if (named === null) return;
        title = named.trim() || suggested;

      savingWorksheet = true;
      const saveBtn = $('saveWorksheetBtn');
      if (saveBtn) saveBtn.disabled = true;
      try {
        const local = await saveBrowserLesson({
          id: lastSavedId || undefined,
          title,
          payload,
        });
        lastSavedId = local.id;

        // Best-effort mirror to the server (may vanish on free Render).
        try {
          await fetch('api/saved-lessons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: local.id,
              title: local.title,
              payload,
            }),
          });
        } catch {
          /* ignore server mirror */
        }

        await refreshSavedList();
        setStatus(ui('statusSaved'));
      } catch (err) {
        setStatus(err.message || ui('errSave'), true);

        savingWorksheet = false;
        updateSaveWorksheetBtn();
