    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }

    async function exportVocabToLingoSpark() {
      const pairs = collectLessonGlossary(lastPayload?.lesson);
      if (!pairs.length) {
        setStatus(ui('statusVocabEmpty'), true);
        return;
      }
      const text = formatLingoSparkGlossary(pairs);
      let copied = false;
      try {
        copied = await copyText(text);
      } catch {
        copied = false;
      }
      if (!copied) {
        window.prompt(ui('statusVocabCopyFail'), text);
      }
      window.open(LINGOSPARK_WORDSET_URL, '_blank', 'noopener,noreferrer');
      setStatus(
        ui(copied ? 'statusVocabCopied' : 'statusVocabCopyFail').replace('{n}', String(pairs.length))
      );
    }

    let healthError = '';
    let lastDeck = null;
    let lastLessonTitle = 'lesson';
    let lastSavedId = '';
    let slideIndex = 0;
    let outputMode = 'student';

    function bindTaskReorder(sheet) {
      const blocks = [...sheet.querySelectorAll('.task-block')];
      blocks.forEach((el, i) => {
        const up = el.querySelector('.task-move[data-dir="up"]');
        const down = el.querySelector('.task-move[data-dir="down"]');
        if (up) up.disabled = i === 0;
        if (down) down.disabled = i === blocks.length - 1;
      });
      sheet.querySelectorAll('.task-move').forEach((btn) => {
        btn.onclick = () => moveWorksheetTask(btn.dataset.task, btn.dataset.dir === 'up' ? -1 : 1);
      });
      sheet.querySelectorAll('.task-remove').forEach((btn) => {
        btn.onclick = () => removeWorksheetTask(btn.dataset.task);
      });
    }

    function clearPresentation() {
      lastDeck = null;
      $('presentationBtn').classList.add('is-hidden');
      $('deck').classList.remove('show');
      $('deck').innerHTML = '';
      setOutputMode('student');
    }

    function removeWorksheetTask(id) {
      if (!lastPayload?.tasks) return;
      const { base, index } = parseTaskId(id);
      if (index != null) {
        const key = groupArrayKey(base);
        if (key && Array.isArray(lastPayload.lesson?.[key])) {
          lastPayload.lesson[key].splice(index, 1);
        }
        lastPayload.tasks = reindexAfterRemove(lastPayload.tasks, base, index);
        lastPayload.taskOrderCustom = true;
        clearPresentation();
        const y = window.scrollY;
        renderLesson(lastPayload);
        window.scrollTo(0, y);
        return;
      }
      const order = lastPayload.tasks;
      const i = order.indexOf(id);
      if (i < 0) return;
      order.splice(i, 1);
      lastPayload.taskOrderCustom = true;
      if (!lastPayload.removedTasks) lastPayload.removedTasks = [];
      if (!lastPayload.removedTasks.includes(id)) lastPayload.removedTasks.push(id);
      // Also drop any indexed children of this group.
      lastPayload.tasks = lastPayload.tasks.filter((tid) => parseTaskId(tid).base !== id);
      if (base === 'vocabBuild') lastPayload.lesson.vocabBuilding = [];
      if (base === 'grammar') lastPayload.lesson.grammarPractice = [];
      if (base === 'practice') lastPayload.lesson.practiceExercises = [];
      clearPresentation();
      const y = window.scrollY;
      renderLesson(lastPayload);
      window.scrollTo(0, y);
    }

    function moveWorksheetTask(id, dir) {
      if (!lastPayload?.tasks) return;
      const order = lastPayload.tasks;
      const i = order.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      lastPayload.taskOrderCustom = true;
      clearPresentation();
      const y = window.scrollY;
      renderLesson(lastPayload);
      window.scrollTo(0, y);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(ui('errPdf')));
        reader.readAsDataURL(file);
      });
    }

    function themeOfDeck(deck) {
      const t = deck.themeNote || {};
      const accents = t.accents || [];
      return {
        background: t.background || '#F8FAFC',
        text: t.bodyText || '#012169',
        accent: accents[0]?.hex || accents[0] || '#012169',
        accent2: accents[1]?.hex || accents[1] || '#C8102E',
        cefr: deck.cefr || '',
      };
    }

    function paras(text) {
      return String(text || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    }

    function resolveTopicImage(...candidates) {
      for (const item of candidates) {
        if (item?.dataUrl) return item;
      }
      return null;
    }

    function attachTopicImageToDeck(deck, image) {
      if (!deck) return deck;
      if (!image?.dataUrl) {
        deck.topicImage = null;
        const title = (deck.slides || []).find((s) => s.role === 'title');
        if (title) title.topicImage = null;
        return deck;
      }
      deck.topicImage = image;
      const title = (deck.slides || []).find((s) => s.role === 'title');
      if (title) title.topicImage = image;
      return deck;
    }

    function slideLogo() {
      return `<img class="slide-brand" src="${LOGO}" alt="LingoSpark">`;
    }

    function youtubeEmbedHtml(id, embedSrc = '') {
      const src = String(embedSrc || '').trim()
        || (String(id || '').trim()
          ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(String(id).trim())}?rel=0&modestbranding=1&enablejsapi=1`
          : '');
      if (!src) return '';
      return `<div class="sv-video"><iframe src="${escapeHtml(src)}" title="Lesson video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
    }

    function youtubeThumbLinkHtml(slide, { compact = false } = {}) {
      const videoId = String(slide?.youtubeId || '').trim();
      const href = String(slide?.sourceUrl || resolveMediaUrl({ url: slide?.sourceUrl, youtubeId: videoId }, {}) || '').trim();
      if (!href && !videoId && !slide?.embedSrc) return '';
      const thumb = slide?.thumbnailUrl
        || (videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : '');
      const label = href || tx('videoWatch');
      const cls = compact ? 'sv-video-link is-compact' : 'sv-video-link';
      return `<a class="${cls}" href="${escapeHtml(href || '#')}" target="_blank" rel="noopener noreferrer">
        ${thumb ? `<img src="${escapeHtml(thumb)}" alt="">` : ''}
        <span>${escapeHtml(compact ? tx('videoWatch') : label)}</span>
      </a>`;
    }

    function syncVideoEmbedInput() {
      const input = $('videoEmbedInput');
      if (!input) return;
      const stored = lastPayload?.lesson?.videoEmbedHtml
        || lastPayload?.lesson?.videoEmbedSrc
        || lastPayload?.source?.embedHtml
        || '';
      if (stored && !input.value.trim()) input.value = stored;
    }

    function applyVideoEmbedFromInput() {
      const raw = $('videoEmbedInput')?.value?.trim() || '';
      if (!lastPayload?.lesson) return null;
      if (!raw) {
        delete lastPayload.lesson.videoEmbedHtml;
        delete lastPayload.lesson.videoEmbedSrc;
        if (lastPayload.source) {
          delete lastPayload.source.embedHtml;
          delete lastPayload.source.embedSrc;
        }
        return null;
      }
      const parsed = parseVideoEmbed(raw);
      if (!parsed) return null;
      lastPayload.lesson.videoEmbedHtml = raw;
      lastPayload.lesson.videoEmbedSrc = parsed.embedSrc;
      if (!lastPayload.source) lastPayload.source = {};
      lastPayload.source.embedHtml = raw;
      lastPayload.source.embedSrc = parsed.embedSrc;
      if (parsed.youtubeId) {
        lastPayload.lesson.youtubeId = parsed.youtubeId;
        lastPayload.source.youtubeId = parsed.youtubeId;
      }
      // Keep worksheet + slide link identical to the listen-box URL when possible.
      const existing = resolveMediaUrl(lastPayload.source, lastPayload.lesson);
      if (!existing && parsed.sourceUrl) {
        lastPayload.source.url = parsed.sourceUrl;
        lastPayload.lesson.sourceUrl = parsed.sourceUrl;
      }
      return parsed;
    }

    function letterIndex(answer, options) {
      return optionIndex(answer, options);
    }

    function mark(html) {
      return `<span class="sv-mark">${html}</span>`;
    }

    function statementText(item) {
      if (item && typeof item === 'object') return item.text || item.statement || '';
      return String(item || '');
    }

    function slotHtml(part, extraClass = '') {
      if (!part.fill) return escapeHtml(part.text);
      const cls = `sv-gap${extraClass ? ` ${extraClass}` : ''}${part.text ? ' sv-mark' : ''}`;
      return `<span class="${cls}">${part.text ? escapeHtml(part.text) : '&nbsp;'}</span>`;
    }

    function fillGapHtml(sentence, word, fill) {
      return gapFillParts(sentence, word, { fill }).map((part) => slotHtml(part)).join('');
    }

    function clozeFilledHtml(text, items, answers, fill, fillUpTo = null) {
      return clozeFillParts(text, items, answers, { fill, fillUpTo }).map((part) => slotHtml(part)).join('');
    }

    function writeLine() {
      return '<span class="sv-write-line"></span>';
    }

    function slideInnerHtml(slide, theme, cefr, opts = {}) {
      const hints = (list) => list?.length ? `<div class="sv-hints">${tx('hints')} ${escapeHtml(list.join(', '))}</div>` : '';
      const showKey = Boolean(slide.revealAnswers);
      const revealUpTo = showKey && Number.isInteger(slide.revealUpTo) ? slide.revealUpTo : (showKey ? null : -1);
      const revealItem = (i) => showKey && (revealUpTo == null || i <= revealUpTo);
      const isNewReveal = (i) => showKey && Number.isInteger(revealUpTo) && i === revealUpTo;
      const itemClass = (i) => `sv-q${isNewReveal(i) ? ' sv-reveal-new' : ''}`;
      if (slide.role === 'title') {
        const photoImage = resolveTopicImage(slide.topicImage, lastDeck?.topicImage);
        const photo = photoImage?.dataUrl
          ? `<div class="title-photo">
              <img src="${photoImage.dataUrl}" alt="${escapeHtml(photoImage.alt || slide.header || '')}">
              ${photoImage.credit ? `<p class="title-photo-credit">${escapeHtml(photoImage.credit)}</p>` : ''}
            </div>`
          : '';
        const copy = `
          <div class="sv-kicker">${escapeHtml(cefr)}</div>
          <h2 style="color:#fff">${escapeHtml(slide.header || '')}</h2>
          <p class="sv-sub">${escapeHtml(slide.subhead || '')}</p>
          <span class="sv-badge" style="background:#fff;color:${theme.accent}">${escapeHtml(cefr)}</span>`;
        if (photo) {
          return `<div class="slide-view title-slide has-photo" style="background:${theme.accent};color:#fff">
            <div class="title-copy">${copy}</div>
            ${photo}
            ${slideLogo()}
          </div>`;
        }
        return `<div class="slide-view title-slide" style="background:${theme.accent};color:#fff">
          ${copy}
          ${slideLogo()}
        </div>`;
      }
      const extraClass = [
        slide.role === 'reflection' ? 'sv-reflection' : '',
        showKey ? 'is-answer-reveal' : '',
      ].filter(Boolean).join(' ');
      const shell = (body) => `<div class="slide-view ${extraClass}" style="background:${theme.background};color:${theme.text};border-left:12px solid ${theme.accent}">
        <h2 style="color:${theme.accent}">${escapeHtml(slide.header || '')}</h2>
        <div class="sv-body${slide.role === 'reflection' ? ' sv-reflection-body' : ''}">${body}</div>
        ${slideLogo()}
      </div>`;

      if (slide.role === 'vocab') {
        const rows = (slide.vocab || []).map((item) =>
          `<div class="sv-vocab-word" style="color:${theme.accent}">${escapeHtml(item.word || '')}</div>
           <div class="sv-vocab-def">${escapeHtml(item.definition || '')}</div>`
        ).join('');
        return shell(`<div class="sv-vocab">${rows}</div>`);
      }
      if (slide.role === 'video') {
        const link = youtubeThumbLinkHtml(slide);
        const compact = youtubeThumbLinkHtml(slide, { compact: true });
        const embed = !opts.forPdf
          ? youtubeEmbedHtml(slide.youtubeId, slide.embedSrc)
          : '';
        if (opts.forPdf || !embed) {
          if (link) return shell(`<div class="sv-video-stage">${link}</div>`);
          const href = slide.sourceUrl || '#';
          return shell(`<p><a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(slide.sourceUrl || tx('videoWatch'))}</a></p>`);
        }
        return shell(`<div class="sv-video-stage">
          ${embed}
          ${compact ? `<div class="sv-video-fallback">${compact}</div>` : ''}
        </div>`);
      }
      if (slide.role === 'chunk') {
        const read = paras(slide.leftText || slide.bodyContent).map((p) => `<p>${escapeHtml(p)}</p>`).join('');
        const qs = (slide.questions || []).map((q, i) => {
          const text = typeof q === 'string' ? q : q.text;
          return `<div class="sv-q"><strong>${i + 1}.</strong> ${escapeHtml(text || '')}${writeLine()}</div>`;
        }).join('');
        if (!qs) return shell(`<div class="sv-read">${read}</div>`);
        return shell(`<div class="sv-grid"><div class="sv-read">${read}</div><div class="sv-qcol">${qs}</div></div>`);
      }
      if (slide.role === 'debate') {
        return shell(`<p class="sv-quote">${escapeHtml(slide.thesis || '')}</p>
          <div class="sv-grid">
            <div class="sv-card" style="background:${theme.accent};color:#fff;border:none"><h3 style="color:#fff">${tx('teamPro')}</h3>${(slide.pro || []).map((p) => `<p>${escapeHtml(p)}</p>`).join('')}</div>
            <div class="sv-card" style="background:${theme.accent2};color:#fff;border:none"><h3 style="color:#fff">${tx('teamCon')}</h3>${(slide.con || []).map((p) => `<p>${escapeHtml(p)}</p>`).join('')}</div>
          </div>`);
      }
      if (slide.role === 'scenario') {
        return shell(`<p>${escapeHtml(slide.dilemma || '')}</p>
          <div class="sv-grid">
            <div class="sv-card" style="color:${theme.accent}"><h3>${tx('optionA')}</h3><p style="color:${theme.text}">${escapeHtml(slide.optionA || '')}</p></div>
            <div class="sv-card" style="color:${theme.accent2}"><h3>${tx('optionB')}</h3><p style="color:${theme.text}">${escapeHtml(slide.optionB || '')}</p></div>
          </div>
          <p style="margin-top:0.7rem"><strong>${escapeHtml(slide.task || '')}</strong></p>${hints(slide.hints)}`);
      }
      if (slide.role === 'cloze' || slide.role === 'gapfill') {
        const bank = (slide.wordBank || []).length
          ? `<div class="sv-bank" style="background:${theme.accent}">${tx('wordBank')} ${escapeHtml(slide.wordBank.join('  ·  '))}</div>`
          : '';
        const text = clozeFilledHtml(
          slide.clozeText || slide.bodyContent || '',
          slide.clozeItems,
          slide.answers,
          showKey,
          revealUpTo,
        );
        const items = (slide.clozeItems || []).map((item, idx) => {
          const correct = letterIndex(item.answer, item.options);
          const opts = (item.options || []).map((o, i) => {
            const letter = `${String.fromCharCode(65 + i)}) `;
            const body = escapeHtml(o);
            return revealItem(idx) && i === correct ? `${letter}${mark(body)}` : `${letter}${body}`;
          }).join(' &nbsp; ');
          return `<p class="${itemClass(idx)}">(${escapeHtml(item.blank || item.num || '')}) ${opts}</p>`;
        }).join('');
        return shell(`${bank}<p class="sv-cloze">${text}</p>${items}`);
      }
      if (slide.role === 'wordbank' || slide.role === 'vocabbuild' || slide.role === 'wordform') {
        const bank = (slide.wordBank || []).length
          ? `<div class="sv-bank" style="background:${theme.accent}">${tx('wordBank')} ${escapeHtml(slide.wordBank.join('  ·  '))}</div>`
          : '';
        const linesHtml = (slide.sentences || []).length
          ? slide.sentences.map((line, i) => {
            const word = answerWord((slide.answers || [])[i] || '');
            return `<p class="${itemClass(i)}">${i + 1}. ${fillGapHtml(line, word, revealItem(i))}</p>`;
          }).join('')
          : (slide.bullets || []).map((b, i) => {
            const word = answerWord((slide.answers || [])[i] || '');
            return `<p class="${itemClass(i)}">${fillGapHtml(b, word, revealItem(i))}</p>`;
          }).join('');
        return shell(`${bank}${linesHtml}`);
      }
      if (slide.role === 'grammar') {
        const linesHtml = (slide.sentences || []).map((line, i) => {
          const word = answerWord((slide.answers || [])[i] || '');
          const opts = (slide.itemOptions || [])[i] || [];
          if (opts.length) {
            const correct = letterIndex(word, opts);
            const optsHtml = opts.map((o, n) => {
              const letter = `${String.fromCharCode(65 + n)}) `;
              const body = escapeHtml(o);
              return revealItem(i) && n === correct ? `${letter}${mark(body)}` : `${letter}${body}`;
            }).join(' &nbsp; ');
            return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(line)}</p><p>${optsHtml}</p>`;
          }
          if (!hasTypedGap(line)) {
            return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(line)}</p>${revealItem(i) && word ? `<p>${mark(escapeHtml(word))}</p>` : writeLine()}`;
          }
          return `<p class="${itemClass(i)}">${i + 1}. ${fillGapHtml(line, word, revealItem(i))}</p>`;
        }).join('');
        return shell(linesHtml);
      }
      if (slide.role === 'match') {
        const byLetter = slide.matchByLetter !== false && matchUsesLetters(slide.definitions);
        const words = (slide.words || []).map((w, i) => {
          const partner = (slide.answers || [])[i] || '';
          if (byLetter) {
            const slot = slotHtml({ fill: true, text: revealItem(i) ? partner : '' }, 'sv-gap-letter');
            return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(w)} ${slot}</p>`;
          }
          return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(w)}</p>`;
        }).join('');
        const rightItems = byLetter
          ? (slide.definitions || [])
          : (slide.words || []).map((_, i) => (
            revealItem(i)
              ? ((slide.answers || [])[i] || '')
              : ((slide.definitions || [])[i] || '')
          ));
        const defs = rightItems.map((d, i) => {
          const letter = definitionLetter(d);
          const text = definitionText(d) || answerWord(d);
          const letterBit = byLetter && letter ? `<strong>${escapeHtml(letter)}.</strong> ` : '';
          const body = escapeHtml(text);
          const showPartner = !byLetter && revealItem(i) && body;
          return `<p class="${itemClass(i)}">${letterBit}${showPartner ? mark(body) : body}</p>`;
        }).join('');
        return shell(`<div class="sv-grid"><div>${words}</div><div>${defs}</div></div>`);
      }
      if (slide.role === 'practice') {
        const items = (slide.bullets || []).map((b, i) => {
          const word = answerWord((slide.answers || [])[i] || '');
          const space = String((slide.spaces || [])[i] || '').toLowerCase();
          const kind = String(slide.kind || '').toLowerCase();
          const extraLines = (space === 'draw' || space === 'grid' || kind === 'draw' || kind === 'construct' || kind === 'table')
            ? `${writeLine()}${writeLine()}${writeLine()}`
            : writeLine();
          if (revealItem(i) && word) {
            return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(b)}</p><p>${mark(escapeHtml(word))}</p>`;
          }
          return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(b)}</p>${extraLines}`;
        }).join('');
        return shell(items);
      }
      if (slide.role === 'open' || slide.role === 'discussion' || slide.role === 'whatif') {
        const items = (slide.bullets || []).map((b, i) =>
          `<p class="sv-q">${i + 1}. ${escapeHtml(b)}${writeLine()}</p>`
        ).join('');
        return shell(items);
      }
      if (slide.role === 'mcq') {
        const items = (slide.mcqs || []).map((q, i) => {
          const correct = letterIndex(q.answer, q.options);
          const opts = (q.options || []).map((o, n) => {
            const letter = `${String.fromCharCode(65 + n)}) `;
            const body = escapeHtml(o);
            return revealItem(i) && n === correct ? `${letter}${mark(body)}` : `${letter}${body}`;
          }).join(' &nbsp; ');
          return `<p class="${itemClass(i)}"><strong>${i + 1}.</strong> ${escapeHtml(q.question || '')}<br>${opts}</p>`;
        }).join('');
        return shell(items);
      }
      if (slide.role === 'tf') {
        const items = (slide.statements || slide.bullets || []).map((line, i) => {
          const text = statementText(line);
          const ans = line && typeof line === 'object' ? line.answer : undefined;
          const label = tfLabel(ans);
          const pair = tfWords(contentLang);
          const trueHtml = revealItem(i) && label === 'True' ? mark(pair.true) : pair.true;
          const falseHtml = revealItem(i) && label === 'False' ? mark(pair.false) : pair.false;
          return `<p class="${itemClass(i)}">${i + 1}. ${escapeHtml(text)} &nbsp; ${trueHtml} / ${falseHtml}</p>`;
        }).join('');
        return shell(items);
      }
      if (slide.role === 'source') {
        return shell(`<p class="sv-sub">${escapeHtml(slide.sourceTitle || '')}</p>
          <p>${escapeHtml(slide.publisher || '')}</p>
          <p>${escapeHtml(slide.date || tx('dateUnknown'))}</p>`);
      }
      if (slide.role === 'reflection') {
        return shell(`<p class="sv-quote" style="color:${theme.accent}">${slide.quote ? `“${escapeHtml(slide.quote)}”` : ''}</p>
          <p class="sv-q sv-reflection-q">${escapeHtml(slide.question || '')}${writeLine()}</p>${hints(slide.hints)}`);
      }
      if (slide.role === 'guidedwriting') {
        const bullets = (slide.bullets || []).map((b) => `<li>${escapeHtml(b)}</li>`).join('');
        const sample = showKey && slide.sampleAnswer
          ? `<p class="sv-q">${mark(escapeHtml(slide.sampleAnswer))}</p>`
          : `${writeLine()}${writeLine()}${writeLine()}${writeLine()}${writeLine()}${writeLine()}`;
        return shell(`${bullets ? `<ul>${bullets}</ul>` : ''}${sample}`);
      }
      const bullets = (slide.bullets || []).map((b) => `<li>${escapeHtml(b)}</li>`).join('');
      const fallback = slide.bodyContent ? `<p>${escapeHtml(slide.bodyContent)}</p>` : '';
      return shell(bullets ? `<ul>${bullets}</ul>` : fallback);
    }

    function slideOverflows(view) {
      const over = (el) => el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2;
      if (over(view)) return true;
      return [...view.querySelectorAll('.sv-body, .sv-grid, .sv-vocab, .sv-read, .sv-card, .sv-qcol, .sv-quote, .sv-reflection-q, .sv-video-stage')].some(over);
    }

    function fitSlideText() {
      const stage = $('stage');
      const view = $('slideFrame')?.querySelector('.slide-view');
      if (!view || !stage || stage.clientHeight < 40) return;
      if (view.classList.contains('title-slide')) {
        view.style.fontSize = `${Math.max(14, stage.clientHeight * 0.045)}px`;
        return;
      }
      if (view.querySelector('.sv-video-stage')) {
        view.style.fontSize = `${Math.max(15, stage.clientHeight * 0.034)}px`;
        return;
      }

      const answerReveal = view.classList.contains('is-answer-reveal');
      const minPx = answerReveal
        ? Math.max(10, stage.clientHeight * 0.02)
        : Math.max(11, stage.clientHeight * 0.024);
      const maxPx = Math.max(minPx + 6, stage.clientHeight * (answerReveal ? 0.078 : 0.092));
      let lo = minPx;
      let hi = maxPx;
      let best = minPx;
      for (let i = 0; i < 16; i += 1) {
        const mid = (lo + hi) / 2;
        view.style.fontSize = `${mid}px`;
        if (slideOverflows(view)) {
          hi = mid;
        } else {
          best = mid;
          lo = mid;
        }
      }
      view.style.fontSize = `${best}px`;
    }

    function scheduleFitSlide() {
      requestAnimationFrame(() => requestAnimationFrame(fitSlideText));
    }

    function showSlide(i) {
      if (!lastDeck?.slides?.length) return;
      slideIndex = (i + lastDeck.slides.length) % lastDeck.slides.length;
      const theme = themeOfDeck(lastDeck);
      const slide = lastDeck.slides[slideIndex];
      const frame = $('slideFrame');
      if (frame) frame.innerHTML = slideInnerHtml(slide, theme, lastDeck.cefr || theme.cefr);
      const label = $('slidePos');
      if (label) label.textContent = `${slideIndex + 1} / ${lastDeck.slides.length}`;

    async function readJsonResponse(res) {
      const text = await res.text();
      const trimmed = String(text || '').trim();
      if (!trimmed) {
        throw new Error(ui(res.ok ? 'errEmptyResponse' : 'errBadResponse'));
      }
      // Render cold-start / gateway pages are HTML, not JSON.
      if (trimmed.startsWith('<') || /<!doctype html/i.test(trimmed.slice(0, 80))) {
        const err = new Error(ui('errServerBusy'));
        err.retryable = true;
        throw err;
      }
      try {
        return JSON.parse(trimmed);
      } catch {
        const err = new Error(ui('errBadResponse'));
        err.retryable = true;
        throw err;
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fetchJson(url, options = {}, { retries = 6 } = {}) {
      let lastError;
      for (let i = 0; i < retries; i += 1) {
        try {
          const res = await fetch(url, options);
          const data = await readJsonResponse(res);
          return { res, data };
        } catch (error) {
          lastError = error;
          if (!error?.retryable || i === retries - 1) throw error;
          setStatus(ui('errServerBusy'));
          await sleep(2500 + i * 1000);
        }
      }
      throw lastError;
    }

    function jobStatusMessage(job) {
      const stage = job?.stage || '';
      if (stage === 'source') return ui('statusJobSource');
      if (stage === 'generate') return ui('statusJobGenerate');
      if (stage === 'image') return ui('statusJobImage');
      if (stage === 'queued' || stage === 'running') return ui('statusBuildingLesson');
      return ui('statusJobWait').replace('{stage}', stage || '…');
    }

    async function pollJob(jobId, { onProgress } = {}) {
      const started = Date.now();
      const maxMs = 12 * 60 * 1000;
      while (Date.now() - started < maxMs) {
        await sleep(2000);
        const { res, data: job } = await fetchJson(`api/jobs/${encodeURIComponent(jobId)}`, {}, { retries: 4 });
        if (!res.ok) throw new Error(job.error || ui('errJobLost'));
        if (typeof onProgress === 'function') onProgress(job);
        if (job.status === 'error') throw new Error(job.error || ui('errCreate'));
        if (job.status === 'done') {
          const resultRes = await fetchJson(`api/jobs/${encodeURIComponent(jobId)}/result`, {}, { retries: 5 });
          if (!resultRes.res.ok) throw new Error(resultRes.data.error || ui('errCreate'));
          return resultRes.data;
        }
      }
      throw new Error(ui('errCreate'));
    }

    async function createLessonViaJob(body) {
      const { res, data } = await fetchJson('api/create-lesson', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }, { retries: 5 });
      if (res.status === 401 || res.status === 402) {
        throw new Error(data.error || 'Sign in and buy a Worksheet Maker use (5 zł / $2) first.');
      }
      if (!res.ok) throw new Error(data.error || ui('errCreate'));
      if (data.lesson) return data;
      if (!data.jobId) throw new Error(data.error || ui('errCreate'));
      return pollJob(data.jobId, {
        onProgress: (job) => setStatus(jobStatusMessage(job)),
      });
    }

      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); showSlide(slideIndex + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); showSlide(slideIndex - 1); }
      if (e.key === 'Escape') document.body.classList.remove('presenting');
    });
    function waitForImages(root) {
      const imgs = [...(root?.querySelectorAll('img') || [])];
      return Promise.all(imgs.map((img) => {
        if (img.complete && img.naturalWidth) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      }));
    }

    function fitSlideIn(stage, view) {
      if (!view || !stage || stage.clientHeight < 40) return;
      const answerReveal = view.classList.contains('is-answer-reveal');
      const minPx = answerReveal
        ? Math.max(10, stage.clientHeight * 0.02)
        : Math.max(11, stage.clientHeight * 0.024);
      const maxPx = Math.max(minPx + 6, stage.clientHeight * (answerReveal ? 0.078 : 0.092));
      let lo = minPx;
      let hi = maxPx;
      let best = minPx;
      for (let i = 0; i < 16; i += 1) {
        const mid = (lo + hi) / 2;
        view.style.fontSize = `${mid}px`;
        if (slideOverflows(view)) {
          hi = mid;
        } else {
          best = mid;
          lo = mid;
        }
      }
      view.style.fontSize = `${best}px`;
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[data-pdf-lib="${src}"]`);
        if (existing) {
          if (existing.dataset.ready === '1') resolve();
          else existing.addEventListener('load', () => resolve(), { once: true });
          existing.addEventListener('error', () => reject(new Error(ui('errPdfExport'))), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.dataset.pdfLib = src;
        script.onload = () => {
          script.dataset.ready = '1';
          resolve();
        };
        script.onerror = () => reject(new Error(ui('errPdfExport')));
        document.head.appendChild(script);
      });
    }

    async function loadPdfLibs() {
      await Promise.all([
        loadScriptOnce('/node_modules/jspdf/dist/jspdf.umd.min.js'),
        loadScriptOnce('/node_modules/html2canvas/dist/html2canvas.min.js'),
      ]);
      const jsPDF = window.jspdf?.jsPDF;
      const html2canvas = window.html2canvas;
      if (typeof jsPDF !== 'function' || typeof html2canvas !== 'function') {
        throw new Error(ui('errPdfExport'));
      }
      return { jsPDF, html2canvas };
    }

    /** html2canvas cannot parse color-mix() / color(); replace with safe hex fallbacks. */
    function replaceCssFunctionCalls(css, fnName, replacer) {
      const token = `${fnName}(`;
      let out = '';
      let i = 0;
      const src = String(css || '');
      while (i < src.length) {
        const idx = src.indexOf(token, i);
        if (idx === -1) {
          out += src.slice(i);
          break;
        }
        out += src.slice(i, idx);
        let depth = 0;
        let j = idx;
        for (; j < src.length; j += 1) {
          const ch = src[j];
          if (ch === '(') depth += 1;
          else if (ch === ')') {
            depth -= 1;
            if (depth === 0) {
              j += 1;
              break;
            }
          }
        }
        const expr = src.slice(idx, j);
        out += replacer(expr);
        i = j;
      }
      return out;
    }

    function fallbackForColorMix(expr) {
      const hexes = [...expr.matchAll(/#([0-9a-fA-F]{3,8})\b/g)].map((m) => m[0]);
      const withWhite = /white|#fff\b|#ffffff\b/i.test(expr);
      const withTransparent = /transparent/i.test(expr);
      if (withTransparent) return 'transparent';
      if (withWhite && hexes[0]) {
        // Pale tint suitable for borders/backgrounds on white paper
        return hexes[0].length <= 4 ? '#dbe4f0' : mixHexTowardWhite(hexes[0], 0.78);
      }
      if (hexes[0]) return hexes[0];
      return '#c5d0de';
    }

    function mixHexTowardWhite(hex, whiteAmount) {
      let h = String(hex || '').replace('#', '');
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      if (h.length !== 6) return '#dbe4f0';
      const n = Number.parseInt(h, 16);
      if (Number.isNaN(n)) return '#dbe4f0';
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      const w = Math.min(1, Math.max(0, whiteAmount));
      const rr = Math.round(r + (255 - r) * w);
      const gg = Math.round(g + (255 - g) * w);
      const bb = Math.round(b + (255 - b) * w);
      return `#${[rr, gg, bb].map((x) => x.toString(16).padStart(2, '0')).join('')}`;
    }

    function sanitizeCssForHtml2Canvas(cssText) {
      let css = String(cssText || '');
      css = replaceCssFunctionCalls(css, 'color-mix', fallbackForColorMix);
      // Modern CSS color() — html2canvas reports this as unsupported "color"
      css = replaceCssFunctionCalls(css, 'color', () => '#334155');
      css = replaceCssFunctionCalls(css, 'oklch', () => '#64748b');
      css = replaceCssFunctionCalls(css, 'oklab', () => '#64748b');
      css = replaceCssFunctionCalls(css, 'lab', () => '#64748b');
      css = replaceCssFunctionCalls(css, 'lch', () => '#64748b');
      return css;
    }

    function prepareHtml2CanvasClone(doc) {
      doc.querySelectorAll('style').forEach((el) => {
        el.textContent = sanitizeCssForHtml2Canvas(el.textContent || '');
      });
      // Inline style attributes can also contain color-mix from theme tooling.
      doc.querySelectorAll('[style]').forEach((el) => {
        const style = el.getAttribute('style');
        if (style && /color-mix\s*\(|\bcolor\s*\(/.test(style)) {
          el.setAttribute('style', sanitizeCssForHtml2Canvas(style));
        }
      });
    }

    function exportBaseName(fallback = 'lesson') {
      const raw = lastLessonTitle || lastDeck?.slides?.[0]?.header || fallback;
      return String(raw)
        .replace(/[^\w\-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 48) || fallback;
    }

    async function ensureDriveReady() {
      await loadGoogleDriveConfig();
      if (!googleDriveConfigured()) {
        throw new Error(ui('errDriveConfig'));
      }
    }

    async function uploadPdfToDrive(blob, name) {
      setStatus(ui('statusDriveUploading'));
      const file = await uploadBlobToDrive(blob, { name, mimeType: 'application/pdf' });
      const label = file?.name || name;
      setStatus(ui('statusDriveSaved').replace('{name}', label));
      if (file?.webViewLink) {
        try {
          window.open(file.webViewLink, '_blank', 'noopener,noreferrer');
        } catch {
          /* ignore popup blockers */
        }
      }
      return file;
    }

    async function buildWorksheetPdf() {
      const sheet = $('sheet');
      const body = sheet?.querySelector('.sheet-body');
      if (!sheet?.classList.contains('show') || !body) {
        throw new Error(ui('errPdfExport'));
      }
      const { jsPDF, html2canvas } = await loadPdfLibs();

      // Match @page { size: A4; margin: 18mm 16mm 12mm 16mm }
      const MM = 96 / 25.4;
      const marginTop = 18;
      const marginRight = 16;
      const marginBottom = 12;
      const marginLeft = 16;
      const contentWpx = (210 - marginLeft - marginRight) * MM;

      const host = document.createElement('div');
      host.setAttribute('aria-hidden', 'true');
      host.className = `pdf-print-root ${document.body.classList.contains('teacher') ? 'teacher' : 'student'}`;
      host.style.cssText = [
        'position:fixed',
        'left:-14000px',
        'top:0',
        `width:${Math.ceil(contentWpx)}px`,
        'background:#fff',
        'z-index:-1',
        'pointer-events:none',
      ].join(';');
      const sheetSize = getComputedStyle(document.documentElement).getPropertyValue('--sheet-size').trim() || '1';
      host.style.setProperty('--sheet-size', sheetSize);

      const clone = sheet.cloneNode(true);
      clone.id = '';
      clone.classList.add('show');
      clone.style.cssText = 'display:block;width:100%;background:transparent;';
      clone.querySelectorAll('.task-reorder, .topic-image-picker, .no-print').forEach((el) => el.remove());

      const cloneBody = clone.querySelector('.sheet-body');
      if (cloneBody) {
        // Keep Polish theme CSS variables from the live sheet.
        ['--pl-accent', '--pl-accent-2', '--pl-bg', '--pl-band', '--pl-radius', '--pl-doodle-opacity', '--pl-pattern', '--pl-margin-pad', '--pl-pattern-image', '--pl-font', '--pl-font-body']
          .forEach((key) => {
            const live = body.style.getPropertyValue(key) || getComputedStyle(body).getPropertyValue(key);
            if (live?.trim()) cloneBody.style.setProperty(key, live.trim());
          });
        cloneBody.style.setProperty('--pl-bg', '#FFFFFF');
        const accent = (body.style.getPropertyValue('--pl-accent') || '#012169').trim() || '#012169';
        const accent2 = (body.style.getPropertyValue('--pl-accent-2') || accent).trim() || accent;
        cloneBody.style.borderColor = mixHexTowardWhite(accent, 0.78);
        cloneBody.style.boxShadow = 'none';
        cloneBody.style.borderRadius = getComputedStyle(body).borderRadius || '14px';
        cloneBody.style.margin = '0';
        cloneBody.style.padding = '0';
        clone.querySelectorAll('.sheet-header').forEach((el) => {
          el.style.background = '#ffffff';
          el.style.borderBottomColor = accent;
          el.style.boxShadow = `0 3px 0 ${accent2}`;
        });
        clone.querySelectorAll('.source-text, .listen-box').forEach((el) => {
          el.style.background = '#ffffff';
          el.style.borderColor = mixHexTowardWhite(accent2, 0.65);
          el.style.borderLeftColor = accent2;
        });
        clone.querySelectorAll('.chip').forEach((el) => {
          el.style.background = mixHexTowardWhite(accent, 0.88);
          el.style.borderColor = mixHexTowardWhite(accent, 0.82);
          el.style.color = accent;
        });
      }

      host.appendChild(clone);
      document.body.appendChild(host);

      try {
        await waitForImages(host);
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        const target = cloneBody || clone;
        const canvas = await html2canvas(target, {
          backgroundColor: '#ffffff',
          scale: 2,
          useCORS: true,
          logging: false,
          width: Math.ceil(contentWpx),
          windowWidth: Math.ceil(contentWpx),
          onclone: (doc) => {
            prepareHtml2CanvasClone(doc);
            const root = doc.querySelector('.pdf-print-root');
            if (root) root.style.left = '0';
          },
        });

        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const usableW = pageW - marginLeft - marginRight;
        const usableH = pageH - marginTop - marginBottom;
        const imgW = usableW;
        const imgH = (canvas.height * imgW) / canvas.width;
        const pageCanvasH = Math.max(1, Math.floor((usableH / imgH) * canvas.height));

        let y = 0;
        let page = 0;
        while (y < canvas.height) {
          const sliceH = Math.min(pageCanvasH, canvas.height - y);
          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = canvas.width;
          pageCanvas.height = sliceH;
          const ctx = pageCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
          ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
          const dataUrl = pageCanvas.toDataURL('image/jpeg', 0.93);
          const sliceMm = (sliceH * imgW) / canvas.width;
          if (page > 0) pdf.addPage();
          pdf.addImage(dataUrl, 'JPEG', marginLeft, marginTop, imgW, sliceMm, undefined, 'FAST');
          y += sliceH;
          page += 1;
        }
        return pdf.output('blob');
      } finally {
        host.remove();
      }
    }

    async function buildPresentationPdf(deck) {
      const { jsPDF, html2canvas } = await loadPdfLibs();
      const slides = deck.slides || [];
      if (!slides.length) throw new Error(ui('errPdfExport'));

      const W = 1920;
      const H = 1080;
      const theme = themeOfDeck(deck);
      const cefr = deck.cefr || theme.cefr;
      const host = document.createElement('div');
      host.setAttribute('aria-hidden', 'true');
      host.style.cssText = [
        'position:fixed',
        'left:-14000px',
        'top:0',
        `width:${W}px`,
        `height:${H}px`,
        'overflow:hidden',
        'background:#fff',
        'z-index:-1',
        'pointer-events:none',
      ].join(';');
      const frame = document.createElement('div');
      frame.style.cssText = 'width:100%;height:100%;';
      host.appendChild(frame);
      document.body.appendChild(host);

      try {
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'pt',
          format: [W * 0.75, H * 0.75],
          compress: true,
        });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        for (let i = 0; i < slides.length; i += 1) {
          frame.innerHTML = slideInnerHtml(slides[i], theme, cefr, { forPdf: true });
          const view = frame.querySelector('.slide-view');
          await waitForImages(frame);
          fitSlideIn(host, view);
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          const canvas = await html2canvas(view || frame, {
            backgroundColor: '#ffffff',
            scale: 1,
            width: W,
            height: H,
            windowWidth: W,
            windowHeight: H,
            useCORS: true,
            logging: false,
            onclone: (doc) => {
              prepareHtml2CanvasClone(doc);
            },
          });
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
          if (i > 0) pdf.addPage([pageW, pageH], 'landscape');
          pdf.addImage(dataUrl, 'JPEG', 0, 0, pageW, pageH, undefined, 'FAST');
        }
        return pdf.output('blob');
      } finally {
        host.remove();
      }
    }

    async function exportWorksheetToDrive() {
      const btn = $('driveWorksheetBtn');
      btn.disabled = true;
      try {
        await ensureDriveReady();
        setStatus(ui('statusDriveBuilding'));
        const blob = await buildWorksheetPdf();
        const suffix = document.body.classList.contains('teacher') ? 'teacher-key' : 'worksheet';
        await uploadPdfToDrive(blob, `${exportBaseName()}-${suffix}.pdf`);
      } catch (err) {
        setStatus(err.message || ui('errDriveUpload'), true);
      } finally {
        btn.disabled = false;
      }
    }

    async function exportSlidesToDrive() {
      if (!lastDeck?.slides?.length) return;
      const btn = $('driveSlidesBtn');
      btn.disabled = true;
      const resume = slideIndex;
      try {
        await ensureDriveReady();
        setStatus(ui('statusDriveBuilding'));
        const blob = await buildPresentationPdf(lastDeck);
        await uploadPdfToDrive(blob, `${exportBaseName()}-slides.pdf`);
      } catch (err) {
        setStatus(err.message || ui('errDriveUpload'), true);
      } finally {
        btn.disabled = false;
        if (lastDeck?.slides?.length) showSlide(resume);
      }
    }

    $('downloadPdfBtn').onclick = async () => {
      if (!lastDeck?.slides?.length) return;
      const btn = $('downloadPdfBtn');
      btn.disabled = true;
      setStatus(ui('statusPdfBuilding'));
      const resume = slideIndex;
      try {
        const blob = await buildPresentationPdf(lastDeck);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${exportBaseName()}.pdf`;
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus(ui('statusPdfSaved'));
      } catch (err) {
        setStatus(err.message || ui('errPdfExport'), true);
      } finally {
        btn.disabled = false;
        if (lastDeck?.slides?.length) showSlide(resume);
      }
    };

    $('driveSlidesBtn').onclick = () => {
      exportSlidesToDrive();
    };

  </script>
</body>
</html>
