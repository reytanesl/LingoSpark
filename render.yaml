services:
  - type: web
    name: lingospark
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: CURSOR_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lingospark-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: BMC_PAYMENT_URL
        sync: false
      - key: BMC_WEBHOOK_SECRET
        sync: false

databases:
  - name: lingospark-db
    plan: free
