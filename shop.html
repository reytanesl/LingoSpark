<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep — materiały dla nauczyciela i ucznia | LingoSpark</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --font-primary: 'Poppins', 'Montserrat', 'Nunito', sans-serif;
            --font-secondary: 'Inter', 'Roboto', 'Lato', sans-serif;
            --royal-blue: #012169;
            --pillarbox-red: #C8102E;
            --bright-white: #FFFFFF;
            --light-grey: #F4F5F7;
            --text-dark: #2D2D2D;
            --text-muted: #5A5A5A;
            --success-green: #00823B;
            --border-light: #E0E0E0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 100%; }
        body {
            font-family: var(--font-secondary);
            background: var(--light-grey);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 3rem;
        }
        h1, h2, h3 { font-family: var(--font-primary); }
        a { color: var(--royal-blue); }
        a:hover { color: var(--pillarbox-red); }

        header {
            background: #fff;
            padding: 0.85rem 0 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
        }
        .main-logo-container {
            max-width: 648px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-logo-container img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: min(141px, 20.3vh);
            object-fit: contain;
            display: block;
            background: #FFFFFF;
        }

        .auth-bar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            max-width: 1200px; margin: 0 auto; padding: 0.75rem 1.5rem; flex-wrap: wrap;
            background: var(--pillarbox-red); border-radius: 0 0 10px 10px;
        }
        .auth-bar-left, .auth-bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .auth-bar-right { margin-left: auto; }
        .auth-nav-btn {
            padding: 0.4rem 0.85rem; font-size: 0.85rem; border: 2px solid #fff;
            background: transparent; color: #fff; border-radius: 8px;
            font-family: var(--font-primary); font-weight: 600; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .auth-nav-btn:hover, .auth-nav-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
        .auth-premium-btn {
            background: #fff; color: var(--pillarbox-red); border-color: #fff;
        }
        .auth-premium-btn:hover { background: rgba(255,255,255,0.92); color: var(--royal-blue); }

        .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }

        .hero {
            background: #fff;
            border-radius: 12px;
            border-top: 4px solid var(--royal-blue);
            padding: 1.5rem 1.6rem 1.35rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 1.25rem;
        }
        .hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .hero h1 { color: var(--royal-blue); font-size: 1.85rem; margin-bottom: 0.35rem; }
        .hero p { color: var(--text-muted); max-width: 72ch; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1rem; }
        .lang-switch {
            display: inline-flex;
            border: 2px solid var(--royal-blue);
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .lang-switch button {
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.82rem;
            padding: 0.38rem 0.85rem;
            border: none;
            background: #fff;
            color: var(--royal-blue);
            cursor: pointer;
        }
        .lang-switch button:hover { background: rgba(1,33,105,0.06); }
        .lang-switch button.active {
            background: var(--royal-blue);
            color: #fff;
        }

        .shop-layout {
            display: grid;
            grid-template-columns: minmax(200px, 220px) 1fr;
            gap: 1.35rem;
            align-items: start;
        }
        .shop-sidebar {
            position: sticky;
            top: 1rem;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 1rem 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .sidebar-section + .sidebar-section {
            margin-top: 1.1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }
        .sidebar-title {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 0.55rem 0.35rem;
        }
        .shop-categories,
        .shop-exam-filters {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .sidebar-btn {
            display: block;
            width: 100%;
            text-align: left;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.5rem 0.65rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-dark);
        }
        .sidebar-btn:hover { background: rgba(1,33,105,0.06); color: var(--royal-blue); }
        .sidebar-btn.active {
            background: rgba(1,33,105,0.1);
            color: var(--royal-blue);
        }
        .shop-main { min-width: 0; }
        .shop-empty {
            background: #fff;
            border-radius: 12px;
            border: 1px dashed var(--border-light);
            padding: 2rem 1.25rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 0.45rem;
            font-family: var(--font-primary); font-weight: 700; font-size: 0.92rem;
            padding: 0.65rem 1.15rem; border-radius: 10px; text-decoration: none; border: 2px solid transparent;
        }
        .btn-red { background: var(--pillarbox-red); color: #fff; border-color: var(--pillarbox-red); }
        .btn-red:hover { background: #a50d25; color: #fff; border-color: #a50d25; }
        .btn-blue { background: var(--royal-blue); color: #fff; border-color: var(--royal-blue); }
        .btn-blue:hover { background: #01164a; color: #fff; }
        .btn-outline { background: #fff; color: var(--royal-blue); border-color: var(--royal-blue); }
        .btn-outline:hover { background: rgba(1,33,105,0.06); color: var(--royal-blue); }

        .filters {
            display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 1.15rem;
        }
        .filter-btn {
            font-family: var(--font-primary); font-weight: 600; font-size: 0.88rem;
            padding: 0.4rem 0.95rem; border-radius: 999px; cursor: pointer;
            border: 2px solid var(--royal-blue); background: #fff; color: var(--royal-blue);
        }
        .filter-btn:hover { background: rgba(1,33,105,0.06); }
        .filter-btn.active { background: var(--royal-blue); color: #fff; }

        @media (max-width: 820px) {
            .shop-layout { grid-template-columns: 1fr; }
            .shop-sidebar {
                position: static;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem 1rem;
            }
            .sidebar-section + .sidebar-section {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
            }
            .shop-categories,
            .shop-exam-filters {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.35rem;
            }
            .sidebar-btn {
                width: auto;
                padding: 0.4rem 0.75rem;
                border: 1px solid var(--border-light);
                border-radius: 999px;
                font-size: 0.82rem;
            }
            .sidebar-btn.active {
                border-color: var(--royal-blue);
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 280px));
            gap: 1.75rem;
            justify-content: start;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 1.2rem 1.25rem 1.2rem;
            min-height: 0;
        }
        .card.featured {
            border-color: var(--royal-blue);
            border-width: 2px;
        }
        .kicker {
            font-family: var(--font-primary);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--pillarbox-red);
            line-height: 1.2;
        }
        .card h2 {
            color: var(--text-dark);
            font-size: 1.22rem;
            line-height: 1.3;
            margin: 0.4rem 0 0.28rem;
            font-weight: 700;
        }
        .meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.35;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.5;
            margin: 0.5rem 0 0.85rem;
        }
        .card-foot {
            margin-top: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 0.7rem;
        }
        .price {
            font-family: var(--font-primary);
            letter-spacing: -0.02em;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            line-height: 1.15;
        }
        .price-pln {
            font-weight: 800;
            color: var(--royal-blue);
            font-size: 1.22rem;
        }
        .price-usd {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.88rem;
        }
        .card .btn {
            padding: 0.48rem 0.9rem;
            font-size: 0.88rem;
            border-radius: 8px;
            gap: 0;
        }
        .card.has-preview {
            grid-column: 1 / -1;
            max-width: 380px;
        }
        @media (min-width: 860px) {
            .card.has-preview { max-width: 400px; }
        }
        .preview-scroll {
            max-height: 360px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: #eef1f6;
            padding: 6px;
            margin: 0.45rem 0 0.55rem;
            scroll-behavior: smooth;
        }
        .preview-scroll img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .preview-scroll img:last-child { margin-bottom: 0; }
        .preview-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .note {
            margin-top: 1.5rem; padding: 1rem 1.15rem; background: #fff; border-radius: 10px;
            border-left: 4px solid var(--royal-blue); color: var(--text-muted); font-size: 0.92rem;
        }

        .site-copyright {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
            text-align: center; padding: 0.45rem 0.75rem; font-size: 0.75rem;
            color: var(--text-muted); background: rgba(255,255,255,0.94);
            border-top: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="main-logo-container">
                <a href="/"><img src="Projekt bez nazwy.png" alt="LingoSpark"></a>
            </div>
        </div>
    </header>

    <div class="auth-bar">
        <div class="auth-bar-left">
            <a href="/" class="auth-nav-btn"><i class="fa-solid fa-house"></i> Gry</a>
            <a href="/shop.html" class="auth-nav-btn active"><i class="fa-solid fa-bag-shopping"></i> Shop</a>
            <a href="https://buymeacoffee.com/lingospark/extras" class="auth-nav-btn auth-premium-btn" target="_blank" rel="noopener"><i class="fa-solid fa-crown"></i> Buy Me a Coffee</a>
        </div>
    </div>

    <main class="wrap">
        <section class="hero">
            <div class="hero-top">
                <div>
                    <h1 id="shop-title">Sklep dla nauczyciela i ucznia</h1>
                    <p id="shop-intro"></p>
                </div>
                <div class="lang-switch" role="group" id="lang-switch" aria-label="Language">
                    <button type="button" data-lang="pl" class="active">PL</button>
                    <button type="button" data-lang="en">EN</button>
                </div>
            </div>
            <div class="hero-actions">
                <a class="btn btn-red" id="bmc-shop-btn" href="https://buymeacoffee.com/lingospark/extras" target="_blank" rel="noopener">
                    <i class="fa-solid fa-mug-hot"></i> <span id="bmc-shop-btn-label">Otwórz sklep</span>
                </a>
                <a class="btn btn-outline" href="mailto:karolsenk@gmail.com"><i class="fa-solid fa-envelope"></i> <span id="shop-email-label">Pytania</span>: karolsenk@gmail.com</a>
            </div>
        </section>

        <div class="shop-layout">
            <aside class="shop-sidebar" aria-label="Shop navigation">
                <div class="sidebar-section">
                    <h2 class="sidebar-title" id="sidebar-categories-title">Kategorie</h2>
                    <nav class="shop-categories" id="shop-categories" role="tablist"></nav>
                </div>
                <div class="sidebar-section">
                    <h2 class="sidebar-title" id="sidebar-exam-title">Poziom</h2>
                    <div class="shop-exam-filters" id="shop-exam-filters" role="tablist"></div>
                </div>
            </aside>

            <div class="shop-main">
                <div class="grid" id="shop-grid"></div>
                <p class="shop-empty" id="shop-empty" hidden></p>
            </div>
        </div>

        <p class="note" id="shop-note"></p>
    </main>

    <p class="site-copyright">© <span id="year"></span> Karol Senk, LingoSpark</p>

    <script src="shop/catalog.js"></script>
    <script>
        const shop = window.LS_SHOP || { products: [], bmcShop: 'https://buymeacoffee.com/lingospark/extras' };
        const bmc = shop.bmcShop || 'https://buymeacoffee.com/lingospark/extras';
        const LANG_KEY = 'ls_shop_lang';
        let lang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'pl';
        let categoryFilter = 'all';
        let examFilter = 'all';

        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('bmc-shop-btn').href = bmc;

        function t(key) {
            const pack = shop.i18n?.[lang] || shop.i18n?.pl || {};
            return pack[key] ?? '';
        }

        function loc(value) {
            if (value && typeof value === 'object' && (value.pl || value.en)) {
                return value[lang] || value.pl || value.en || '';
            }
            return value || '';
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function buyUrl(product) {
            return product.buyUrl || bmc;
        }

        function formatMoney(n) {
            if (!Number.isFinite(n)) return '';
            return n % 1 ? n.toFixed(2) : String(n);
        }

        function priceBlock(product) {
            const pln = Number(product.pricePln);
            const usd = Number(product.priceUsd);
            const plnHtml = Number.isFinite(pln)
                ? `<span class="price-pln">${escapeHtml(formatMoney(pln))} zł</span>`
                : '';
            const usdHtml = Number.isFinite(usd)
                ? `<span class="price-usd">$${escapeHtml(formatMoney(usd))}</span>`
                : '';
            return `${plnHtml}${usdHtml}`;
        }

        function examShort(exam) {
            if (exam === 'Egzamin ósmoklasisty') return 'E8';
            if (exam === 'Matura podstawowa') return 'Matura PP';
            if (exam === 'Matura rozszerzona') return 'Matura PR';
            return exam || '';
        }

        function productKicker(p) {
            if (p.kind === 'study-plan') return t('studyPlanKicker');
            return examShort(p.exam);
        }

        function metaLine(p) {
            if (p.kind === 'study-plan') return t('studyPlanMeta');
            return `${p.terms} ${t('terms')}`;
        }

        function matchesCategory(p, filter) {
            if (filter === 'all') return true;
            return Array.isArray(p.categories) && p.categories.includes(filter);
        }

        function matchesExam(p, filter) {
            if (filter === 'all') return true;
            if (filter === 'study-plan') return p.kind === 'study-plan';
            return p.exam === filter;
        }

        function previewBlock(p) {
            const pages = Array.isArray(p.previewPages) ? p.previewPages : [];
            if (!pages.length) return '';
            const hint = typeof t('previewHint') === 'function' ? t('previewHint')(pages.length) : '';
            const imgs = pages
                .map((src) => `<img src="${escapeHtml(src)}" alt="" loading="lazy">`)
                .join('');
            return `
                    <p class="preview-hint">${escapeHtml(hint)}</p>
                    <div class="preview-scroll">${imgs}</div>`;
        }

        function renderProducts() {
            const grid = document.getElementById('shop-grid');
            const empty = document.getElementById('shop-empty');
            const items = (shop.products || []).filter(
                (p) => matchesCategory(p, categoryFilter) && matchesExam(p, examFilter),
            );

            if (!items.length) {
                grid.innerHTML = '';
                empty.hidden = false;
                empty.textContent = t('emptyCategory');
                return;
            }

            empty.hidden = true;
            grid.innerHTML = items.map((p) => {
                const featured = Boolean(p.featured);
                const hasPreview = Array.isArray(p.previewPages) && p.previewPages.length;
                return `
                <article class="card${featured ? ' featured' : ''}${hasPreview ? ' has-preview' : ''}" data-exam="${escapeHtml(p.exam || '')}">
                    <div class="kicker">${escapeHtml(productKicker(p))}</div>
                    <h2>${escapeHtml(loc(p.title))}</h2>
                    <div class="meta">${escapeHtml(metaLine(p))}</div>
                    ${previewBlock(p)}
                    <p>${escapeHtml(loc(p.description))}</p>
                    <div class="card-foot">
                        <div class="price">${priceBlock(p)}</div>
                        <a class="btn btn-blue" href="${escapeHtml(buyUrl(p))}" target="_blank" rel="noopener">${escapeHtml(t('buy'))}</a>
                    </div>
                </article>`;
            }).join('');
        }

        function renderSidebar() {
            const categoriesEl = document.getElementById('shop-categories');
            const examEl = document.getElementById('shop-exam-filters');
            const categories = shop.categories || [];

            categoriesEl.innerHTML = categories.map((cat) => `
                <button type="button" class="sidebar-btn${categoryFilter === cat.id ? ' active' : ''}"
                    data-category="${escapeHtml(cat.id)}" role="tab"
                    aria-selected="${categoryFilter === cat.id}">
                    ${escapeHtml(cat[lang] || cat.pl)}
                </button>`).join('');

            const examFilters = [
                { id: 'all', label: t('examAll') },
                { id: 'study-plan', label: t('examStudyPlan') },
                { id: 'Egzamin ósmoklasisty', label: t('examE8') },
                { id: 'Matura podstawowa', label: t('examMatura') },
                { id: 'Matura rozszerzona', label: t('examMaturaPR') },
            ];

            examEl.innerHTML = examFilters.map((item) => `
                <button type="button" class="sidebar-btn${examFilter === item.id ? ' active' : ''}"
                    data-exam="${escapeHtml(item.id)}" role="tab"
                    aria-selected="${examFilter === item.id}">
                    ${escapeHtml(item.label)}
                </button>`).join('');

            categoriesEl.querySelectorAll('[data-category]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    categoryFilter = btn.dataset.category || 'all';
                    renderSidebar();
                    renderProducts();
                });
            });

            examEl.querySelectorAll('[data-exam]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    examFilter = btn.dataset.exam || 'all';
                    renderSidebar();
                    renderProducts();
                });
            });
        }

        function applyLanguage() {
            document.documentElement.lang = lang;
            document.title = t('pageTitle');
            document.getElementById('shop-title').textContent = t('introTitle');
            document.getElementById('shop-intro').textContent = t('intro');
            document.getElementById('bmc-shop-btn-label').textContent = t('openShop');
            document.getElementById('shop-email-label').textContent = t('questions');
            document.getElementById('sidebar-categories-title').textContent = t('browseCategories');
            document.getElementById('sidebar-exam-title').textContent = t('examLevel');
            document.getElementById('shop-note').innerHTML = t('note');

            document.querySelectorAll('#lang-switch [data-lang]').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            renderSidebar();
            renderProducts();
        }

        document.querySelectorAll('#lang-switch [data-lang]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const next = btn.dataset.lang === 'en' ? 'en' : 'pl';
                if (next === lang) return;
                lang = next;
                localStorage.setItem(LANG_KEY, lang);
                applyLanguage();
            });
        });

        applyLanguage();
    </script>
</body>
</html>
